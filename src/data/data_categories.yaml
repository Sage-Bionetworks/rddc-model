dataCategories:

- id: PATIENT_PROFILE
  name: Patient Profile
  sourceLabel: Patient Profle
  details: Name, Contacts, Address,...

- id: PATIENT_HISTORY
  name: Patient History
  sourceLabel: Anamnesis/Patient History
  details: 'Previous diagnosis, Phenotypes, Measurements, Prior testing, Family History, Non-genetic risk
    factors, Development Delay Assessment, FHC questionnaire (Note: Not comprehensive; We just support
    part of the Patient History (example: we don''t support medication history, allergies history)'
  proposedStandards:
  - HPO
  - SNOMEDCT
  - DOID
  - LOINC
  - OMIM

- id: ASSESSMENTS
  name: Assessments
  sourceLabel: Assessments
  details: Developmental, Behavioral, Physical, Genetic Patient assessment. Physician can perform clinical assessments on the patient.
  proposedStandards:
  - SNOMEDCT
  - MAXO

- id: EHR_DATA
  name: EHR Data
  sourceLabel: EHR Structured Data and Unstructured Data
  details: Patient, Provider, Observations, Conditions, DocumentReferences, Media, Related_Person, DiagnosticReport,Organization
  proposedStandards:
  - FHIR
  - OMOP

- id: ALLERGIES
  name: Allergies
  sourceLabel: Allergies
  proposedStandards:
  - SNOMEDCT
  - HPO
  - RXNORM

- id: SOCIAL_HABITS_RISK_FACTORS
  name: Social Habits / Risk Factors
  sourceLabel: Social habits / Risk Factors
  details: Social habits and risk factors reported on FHC assessment, Risk-factors reported by the physician
    on F2G
  proposedStandards:
  - PJO

- id: FAMILY_HISTORY
  name: Family History
  sourceLabel: Family History
  details: Diagnosis
  proposedStandards:
  - MONDO
  - DOID
  - IDO
  - OMIM
  comments:

- id: GENETIC_TESTING
  name: Genetic Testing
  sourceLabel: Genetic Testing/Molecular Pathology
  details: Genetic Test Results (name, when conducted, result status, report attachments)
