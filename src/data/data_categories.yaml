  proposedStandards:
  - OMIM
  - VRS
  - HGNC

- id: ICD_SNOMED_CODES
  name: ICD / SNOMED Codes
  sourceLabel: ID ICD-codes/ SNOMED
  details: ICD10 codes selected
  proposedStandards:
  - SNOMEDCT

- id: INTAKE_FORMS
  name: Intake Forms
  sourceLabel: Intake Forms
  proposedStandards:
  - PJO
  dataClasses:
  - IntakeFormFile

- id: MEDICATIONS
  name: Medications
  sourceLabel: List of medications
  categorical: true
