# RDDC processing rules: a DRAFT for discussion.
#
# The workflows below are provisional (pipeline ids, versions, locations and
# parameters are placeholders) until the real pipeline inventory replaces them. The
# targets, obligations and prohibitions encode the seed rules (numbered for
# discussion) and rules that read the source register (marked "register").
#
# Checked by scripts/check_rules.py (names exist in the pinned release; verification
# properties hold). scripts/orchestrate.py works out the next steps for a batch.
id: rddc_rules
version: 0.3.0-draft
modelRelease: v0.1.0
description: Draft processing rules with provisional workflows.

# --- data properties --------------------------------------------------------
# A missing contains* flag counts as present.
properties:
- id: direct_identifiers
  description: The contributor has not confirmed that direct identifiers are removed.
  derivedFrom:
  - source: flag_false
    key: directIdentifiersRemoved
- id: identifying
  description: The content can identify a person on its own (identifying or biometric class).
  derivedFrom:
  - source: annotation
    key: identifying
  - source: annotation
    key: biometric
- id: biometric
  description: The content contains biometric identifiers.
  derivedFrom:
  - source: annotation
    key: biometric
  - source: flag_true
    key: containsBiometricIdentifiers
- id: free_text
  description: The content contains free text, or is an unstructured clinical document.
  derivedFrom:
  - source: flag_true
    key: containsFreeText
  - source: data_class
    classes: [ClinicalDocumentFile]
- id: dates
  description: The content contains full dates.
  derivedFrom:
  - source: flag_true
    key: containsDates
- id: zip_codes
  description: The content contains ZIP codes.
  derivedFrom:
  - source: flag_true
    key: containsZipCodes
- id: deid_unconfirmed
  description: De-identification ran, and an independent check has not yet confirmed it. Set by workflows only.
- id: consent_unrecorded
  description: The file's consent elements are not yet recorded in GOVERN's participants table.
  derivedFrom:
  - source: data_class
    classes: [ConsentFile]
- id: unregistered_modality
  description: "Register: the file's modality is not one the source is registered for."
  derivedFrom:
  - source: modality_not_registered
- id: needs_expert_review
  description: "Register: releases from the source need an expert determination."
  derivedFrom:
  - source: register
    key: deidentificationClass
    anyOf: [expert_determination]

# --- standards ----------------------------------------------------------------
# Order matters: an item takes the first standard listed in its file set's conformsTo.
standards:
- id: fhir_r4
  description: FHIR R4
  url: http://hl7.org/fhir/R4
  classes: [FhirFile]
- id: omop_cdm_54
  description: OMOP CDM 5.4
  url: https://ohdsi.github.io/CommonDataModel/cdm54.html
  classes: [OmopTableFile]
- id: ccda_21
  description: C-CDA 2.1
  url: http://hl7.org/cda/us/ccda/2.1
  classes: [CcdaDocumentFile]
- id: ieee_1752_1
  description: IEEE 1752.1
  url: https://standards.ieee.org/ieee/1752.1/6982/
  classes: [SensorMeasureFile]

# --- zones ------------------------------------------------------------------
# Each zone belongs to a platform module (INTAKE, NORMALIZE, DISCOVER). From the deposit,
# a file is held for curation or ingested into the de-identification and QC environment,
# from which the lanes load it into the normalized store. GOVERN holds registers, not
# data, so no zone belongs to it: the register facts the rules read are its source
# register, and record workflows write register entries such as consent elements. The TRE is part of DISCOVER: researchers reach released data from it, so no zone
# before release is TRE.
# Zones with a cirroEnvironment are Cirro environments: only Cirro processes write to
# them, and Cirro processes other than ingests read only from them.
zones:
- id: deposit
  description: The raw deposit prefix.
  module: INTAKE
  initial: true
- id: deid_qc
  description: The INTAKE Cirro environment where de-identification, QC and domain workflows run.
  module: INTAKE
  cirroEnvironment: provisional-rddc-intake
- id: curation
  description: Files held for a curator to decide what to do with them.
  module: INTAKE
  location: s3://provisional-rddc-curation/{sourceId}/{batchId}/{dispatchId}/
- id: normalized
  description: The normalized, analysis-ready store (OMOP and tables), a Cirro environment.
  module: NORMALIZE
  cirroEnvironment: provisional-rddc-normalized
- id: release
  description: The release database, for the protected tier; researchers reach it from the TRE in DISCOVER.
  module: DISCOVER
  location: s3://provisional-rddc-release/{sourceId}/{batchId}/{dispatchId}/
- id: public
  description: Open-tier content published outside the security boundary.
  location: s3://provisional-rddc-public/{sourceId}/{batchId}/{dispatchId}/

# --- workflows (PROVISIONAL) -----------------------------------------------
# Cirro process ids follow Cirro's pattern but are made up. Workflows that write
# outside INTAKE refuse biometric data and data of a modality the source is not
# registered for. Domain analyses that leave the rules' view of the data unchanged
# (genomics QC, facial phenotyping) run in the de-id/QC environment and are not listed: as
# routing steps they would be cycles.
workflows:
- id: ingest_files
  description: Brings deposited files into the de-id/QC environment as a Cirro dataset.
  runner: cirro
  cirroProcess: process-rddc-provisional-ingest-files-0_0
  cirroExecutor: INGEST
  pipelineVersion: 0.0.0
  kind: ingest
  priority: 1
  consumes: {}
  readsFrom: [deposit]
  writesTo: deid_qc
- id: ingest_sequencing
  description: Brings deposited sequencing files into the de-id/QC environment, with sample detection.
  runner: cirro
  cirroProcess: process-rddc-provisional-ingest-sequencing-0_0
  cirroExecutor: INGEST
  pipelineVersion: 0.0.0
  kind: ingest
  consumes:
    classes: [GenomicsFile, IndexFile]
  readsFrom: [deposit]
  writesTo: deid_qc
- id: fhir_to_omop
  description: Lane 2. Transforms a FHIR R4 export to OMOP CDM 5.4 and loads it.
  runner: cirro
  cirroProcess: process-rddc-provisional-fhir-to-omop-0_0
  cirroExecutor: NEXTFLOW
  pipelineVersion: 0.0.0
  kind: transform
  operation: EDAM:operation_0335
  consumes:
    classes: [FhirFile]
    standards: [fhir_r4]
    noProperties: [biometric, unregistered_modality]
  produces: OmopTableFile
  producesStandard: omop_cdm_54
  readsFrom: [deid_qc]
  writesTo: normalized
  parameters:
  - id: source_id
    fromSidecar: batch.sourceId
  - id: fhir_version
    value: R4
- id: omop_load
  description: Lane 1. Loads an OMOP CDM 5.4 instance.
  runner: cirro
  cirroProcess: process-rddc-provisional-omop-load-0_0
  cirroExecutor: NEXTFLOW
  pipelineVersion: 0.0.0
  kind: load
  consumes:
    classes: [OmopTableFile]
    standards: [omop_cdm_54]
    fileSetClasses: [OmopCdmInstance]
    noProperties: [biometric, unregistered_modality]
  readsFrom: [deid_qc]
  writesTo: normalized
  parameters:
  - id: vocabulary_version
    fromSidecar: fileSet.vocabularyVersion
- id: ccda_to_omop
  description: Lane 3. Transforms C-CDA 2.1 documents to OMOP CDM 5.4.
  runner: cirro
  cirroProcess: process-rddc-provisional-ccda-to-omop-0_0
  cirroExecutor: CROMWELL
  pipelineVersion: 0.0.0
  kind: transform
  operation: EDAM:operation_0335
  consumes:
    classes: [CcdaDocumentFile]
    standards: [ccda_21]
    noProperties: [biometric, unregistered_modality]
  produces: OmopTableFile
  producesStandard: omop_cdm_54
  readsFrom: [deid_qc]
  writesTo: normalized
- id: text_deid
  description: Removes identifiers from free text in documents and tables.
  runner: cirro
  cirroProcess: process-rddc-provisional-text-deid-0_0
  cirroExecutor: NEXTFLOW
  pipelineVersion: 0.0.0
  kind: deidentify
  operation: EDAM:operation_3283
  consumes:
    classes: [ClinicalDocumentFile, TabularFile]
    anyProperties: [free_text, direct_identifiers]
    noProperties: [identifying]
  readsFrom: [deid_qc]
  writesTo: deid_qc
  clears: [free_text, direct_identifiers]
  sets: [deid_unconfirmed]
  parameters:
  - id: deid_class
    fromSourceRegister: deidentificationClass
- id: confirm_deid
  description: >-
    Confirms text de-identification with Amazon Comprehend Medical PHI detection (an
    asynchronous job over the files in S3). The dispatcher reports any PHI found as
    the free_text and direct_identifiers properties, which blocks the file for a person.
  runner: service
  pipeline: aws:comprehendmedical:StartPHIDetectionJob
  pipelineVersion: "2018-10-30"
  kind: confirm
  consumes:
    classes: [ClinicalDocumentFile, TabularFile]
    anyProperties: [deid_unconfirmed]
  readsFrom: [deid_qc]
  writesTo: deid_qc
  clears: [deid_unconfirmed]
  parameters:
  - id: language_code
    value: en
  - id: data_access_role_arn
    value: arn:aws:iam::000000000000:role/provisional-rddc-comprehend-medical
  - id: output_s3_uri
    value: s3://provisional-rddc-deid-reports/{sourceId}/{batchId}/{dispatchId}/
- id: tabular_load
  description: Lane 4. Loads other tables and de-identified documents.
  runner: cirro
  cirroProcess: process-rddc-provisional-tabular-load-0_0
  cirroExecutor: NEXTFLOW
  pipelineVersion: 0.0.0
  kind: load
  consumes:
    classes: [TabularFile, ClinicalDocumentFile]
    noProperties: [free_text, deid_unconfirmed, biometric, unregistered_modality]
  readsFrom: [deid_qc]
  writesTo: normalized
- id: record_consent
  description: >-
    Matches the consent elements in a consent file to persons by PPRL linkage ID and
    writes them to GOVERN's participants table. The file stays in INTAKE.
  runner: service
  pipeline: https://provisional.govern.example/participants-table
  pipelineVersion: 0.0.0
  kind: record
  recordsTo: participants table
  consumes:
    classes: [ConsentFile]
    anyProperties: [consent_unrecorded]
  readsFrom: [deid_qc]
  writesTo: deid_qc
  clears: [consent_unrecorded]
- id: imaging_deid
  description: Removes identifiers from DICOM headers. Not for facial images.
  runner: cirro
  cirroProcess: process-rddc-provisional-imaging-deid-0_0
  cirroExecutor: NEXTFLOW
  pipelineVersion: 0.0.0
  kind: deidentify
  operation: EDAM:operation_3283
  consumes:
    classes: [ImagingFile]
    anyProperties: [direct_identifiers]
    noProperties: [biometric]
  readsFrom: [deid_qc]
  writesTo: deid_qc
  clears: [direct_identifiers]
- id: sensor_to_measures
  description: Derives measures (IEEE 1752.1) from raw sensor signals.
  runner: cirro
  cirroProcess: process-rddc-provisional-sensor-to-measures-0_0
  cirroExecutor: CROMWELL
  pipelineVersion: 0.0.0
  kind: transform
  operation: EDAM:operation_0335
  consumes:
    classes: [SensorSignalFile]
  produces: SensorMeasureFile
  producesStandard: ieee_1752_1
  readsFrom: [deid_qc]
  writesTo: deid_qc
- id: sensor_load
  description: Loads sensor measures.
  runner: cirro
  cirroProcess: process-rddc-provisional-sensor-load-0_0
  cirroExecutor: NEXTFLOW
  pipelineVersion: 0.0.0
  kind: load
  consumes:
    classes: [SensorMeasureFile]
    noProperties: [biometric, unregistered_modality]
  readsFrom: [deid_qc]
  writesTo: normalized
- id: curation_hold
  description: Holds a file for a curator.
  runner: service
  pipeline: https://provisional.synapse.example/curation-queue
  pipelineVersion: 0.0.0
  kind: hold
  priority: 9
  consumes: {}
  readsFrom: [deposit]
  writesTo: curation
- id: release_mask_shift
  description: "Register: shifts dates by a per-person offset and truncates ZIP codes to 3 digits."
  runner: cirro
  cirroProcess: process-rddc-provisional-release-mask-0_0
  cirroExecutor: NEXTFLOW
  pipelineVersion: 0.0.0
  kind: mask
  operation: EDAM:operation_3283
  consumes:
    classes: [OmopTableFile, TabularFile, ClinicalDocumentFile, SensorMeasureFile]
    anyProperties: [dates, zip_codes]
    sourceFacts:
    - field: datePolicy
      anyOf: [shift]
  readsFrom: [normalized]
  writesTo: normalized
  clears: [dates, zip_codes]
  parameters:
  - id: date_mode
    value: shift
- id: release_mask_year
  description: "Register: reduces dates to the year and truncates ZIP codes to 3 digits."
  runner: cirro
  cirroProcess: process-rddc-provisional-release-mask-0_0
  cirroExecutor: NEXTFLOW
  pipelineVersion: 0.0.0
  kind: mask
  operation: EDAM:operation_3283
  consumes:
    classes: [OmopTableFile, TabularFile, ClinicalDocumentFile, SensorMeasureFile]
    anyProperties: [dates, zip_codes]
    sourceFacts:
    - field: datePolicy
      anyOf: [year_only]
  readsFrom: [normalized]
  writesTo: normalized
  clears: [dates, zip_codes]
  parameters:
  - id: date_mode
    value: year
- id: expert_determination
  description: "Register: an expert determination of re-identification risk. Records a decision; writes no data."
  runner: service
  pipeline: https://provisional.expert-determination.example/request
  pipelineVersion: 0.0.0
  kind: expert_review
  consumes:
    anyProperties: [needs_expert_review]
  readsFrom: [normalized]
  writesTo: normalized
  clears: [needs_expert_review]
- id: publish
  description: Copies analysis-ready data to the release database.
  runner: container
  pipeline: provisional.registry/publish:0.0.0
  pipelineVersion: 0.0.0
  kind: publish
  consumes:
    classes: [OmopTableFile, TabularFile, ClinicalDocumentFile, SensorMeasureFile]
    noProperties: [direct_identifiers, identifying, biometric, free_text, dates, zip_codes,
                   deid_unconfirmed, unregistered_modality, needs_expert_review]
  readsFrom: [normalized]
  writesTo: release
- id: publish_open
  description: "Register: publishes released data of Open-tier sources whose use terms allow it."
  runner: container
  pipeline: provisional.registry/publish-open:0.0.0
  pipelineVersion: 0.0.0
  kind: publish
  consumes:
    sourceFacts:
    - field: accessTier
      anyOf: [open]
    - field: useTerms
      anyOf: ["DUO:0000004", "DUO:0000042"]
  readsFrom: [release]
  writesTo: public
- id: withdraw_subjects
  description: Removes the listed subjects' data and everything derived from it.
  runner: service
  pipeline: https://provisional.govern.example/withdraw
  pipelineVersion: 0.0.0
  kind: withdraw
  coversZones: [deposit, deid_qc, curation, normalized, release, public]
  parameters:
  - id: notice
    fromSidecar: batch.noticeRef
  - id: subjects
    fromSidecar: batch.subjects
- id: restrict_subjects
  description: Restricts use of the listed subjects' data.
  runner: service
  pipeline: https://provisional.govern.example/restrict
  pipelineVersion: 0.0.0
  kind: restrict
  coversZones: [deposit, deid_qc, curation, normalized, release, public]
  parameters:
  - id: notice
    fromSidecar: batch.noticeRef
  - id: subjects
    fromSidecar: batch.subjects

# --- targets (seed rules 2, 3, 4, 5, 6, 8) -------------------------------------
targets:
- id: unregistered
  description: "Register: a file of a modality the source is not registered for is held for a curator."
  when: {anyProperties: [unregistered_modality]}
  goalZone: curation
  priority: 0
- id: fhir_to_omop
  description: "Seed rule 2: FHIR R4 data ends as OMOP CDM 5.4 in the normalized store."
  when: {classes: [FhirFile], standards: [fhir_r4], noProperties: [biometric]}
  goalClasses: [OmopTableFile]
  goalStandard: omop_cdm_54
  goalZone: normalized
  priority: 1
- id: omop_load
  description: "Seed rule 3: an OMOP CDM 5.4 instance is loaded."
  when: {classes: [OmopTableFile], standards: [omop_cdm_54], fileSetClasses: [OmopCdmInstance], noProperties: [biometric]}
  goalClasses: [OmopTableFile]
  goalZone: normalized
  priority: 1
- id: ccda
  description: "Seed rule 4: C-CDA documents go through lane 3."
  when: {classes: [CcdaDocumentFile], standards: [ccda_21], noProperties: [biometric]}
  goalClasses: [OmopTableFile]
  goalZone: normalized
  priority: 1
- id: tables_and_text
  description: "Seed rule 5: tables and clinical documents go through lane 4."
  when: {classes: [TabularFile, ClinicalDocumentFile], noProperties: [identifying, biometric]}
  goalZone: normalized
  priority: 1
- id: consent
  description: >-
    Seed rule 6: a consent file's consent elements are recorded in GOVERN's participants
    table, and the file stays in INTAKE, out of the clinical lanes.
  when: {classes: [ConsentFile], noProperties: [biometric]}
  goalNoProperties: [consent_unrecorded]
  goalZone: deid_qc
  priority: 1
- id: genomics
  description: Genomics data stays in the de-id/QC environment in INTAKE for omics workflows.
  when: {classes: [GenomicsFile, IndexFile]}
  goalZone: deid_qc
  priority: 1
- id: imaging
  description: Images are kept in the de-id/QC environment for imaging workflows, without direct identifiers.
  when: {classes: [ImagingFile], noProperties: [biometric]}
  goalNoProperties: [direct_identifiers]
  goalZone: deid_qc
  priority: 1
- id: facial
  description: Facial images stay in the de-id/QC environment for facial phenotyping.
  when: {classes: [FacialImagingFile]}
  goalZone: deid_qc
  priority: 1
- id: sensor
  description: "Seed rule 8: raw sensor signals become measures before analysis."
  when: {classes: [SensorDataFile], noProperties: [biometric]}
  goalClasses: [SensorMeasureFile]
  goalZone: normalized
  priority: 1
- id: curation
  description: >-
    Anything else is held for a curator (a deliberate terminal state),
    including clinical data flagged (or not stated not to contain) biometric identifiers.
  when: {}
  goalZone: curation
  priority: 9

# --- obligations and prohibitions (seed rules 1, 5, 7; register) ----------------
obligations:
- id: deidentify_before_release
  description: "Seed rule 1: identifying data is de-identified before release."
  when: {anyProperties: [identifying, direct_identifiers, biometric]}
  requiredKind: deidentify
  beforeZones: [release, public]
- id: text_deid_before_lane4
  description: "Seed rule 5: free text is de-identified before lane 4."
  when: {anyProperties: [free_text]}
  requiredKind: deidentify
  beforeWorkflows: [tabular_load]
- id: confirm_deid_before_loading
  description: De-identified text is confirmed by an independent check before it is loaded or released.
  when: {anyProperties: [deid_unconfirmed]}
  requiredKind: confirm
  beforeZones: [normalized, release, public]
- id: mask_before_release
  description: "Seed rule 7: dates and ZIP codes are masked, per the source's date policy, before release."
  when: {anyProperties: [dates, zip_codes]}
  requiredKind: mask
  beforeZones: [release, public]
- id: expert_review_before_release
  description: "Register: data from an expert-determination source is reviewed before release."
  when: {anyProperties: [needs_expert_review]}
  requiredKind: expert_review
  beforeZones: [release, public]

prohibitions:
- id: biometric_stays_in_intake
  description: "Seed rule 1: biometric data stays in INTAKE: never normalized or released."
  when: {anyProperties: [biometric]}
  zones: [normalized, release, public]
- id: consent_not_clinical
  description: "Seed rule 6: consent files do not enter clinical stores."
  when: {classes: [ConsentFile]}
  zones: [normalized, release, public]
- id: unregistered_stays_in_intake
  description: "Register: data of an unregistered modality stays in INTAKE until a curator decides."
  when: {anyProperties: [unregistered_modality]}
  zones: [normalized, release, public]
- id: only_open_tier_is_public
  description: "Register: only Open-tier sources are published outside the boundary."
  when:
    sourceFacts:
    - field: accessTier
      noneOf: [open]
  zones: [public]

# --- interactions (seed rule 9) ------------------------------------------------
# Seed rule 10 (synthetic batches follow the same routes) holds by construction:
# no property or condition reads the synthetic flag, and check_rules.py fails if one does.
interactionRules:
- interaction: withdraw
  workflow: withdraw_subjects
- interaction: restrict
  workflow: restrict_subjects
