# RDDC processing rules: a DRAFT for discussion.
#
# The workflows below are drafts (pipeline ids, versions, locations and
# parameters are placeholders) until the real pipeline inventory replaces them. The
# targets, obligations and prohibitions encode the seed rules (numbered for
# discussion) and rules that read the source register (marked "register").
#
# Checked by scripts/check_rules.py (names exist in the pinned release; verification
# properties hold). scripts/orchestrate.py works out the next steps for a batch.
id: rddc_rules
version: 0.8.0-draft
modelRelease: v0.1.0
description: Draft processing rules with placeholder workflows.

# --- data properties --------------------------------------------------------
# A missing contains* flag counts as present.
properties:
- id: direct_identifiers
  description: The contributor has not confirmed that direct identifiers are removed.
  derivedFrom:
  - source: flag_false
    key: directIdentifiersRemoved
- id: identifying
  description: The content can identify a person on its own (identifying or biometric class).
  derivedFrom:
  - source: annotation
    key: identifying
  - source: annotation
    key: biometric
- id: biometric
  description: The content contains biometric identifiers.
  derivedFrom:
  - source: annotation
    key: biometric
  - source: flag_true
    key: containsBiometricIdentifiers
- id: free_text
  description: The content contains free text, or is an unstructured clinical document.
  derivedFrom:
  - source: flag_true
    key: containsFreeText
  - source: data_class
    classes: [ClinicalDocumentFile]
- id: dates
  description: The content contains full dates.
  derivedFrom:
  - source: flag_true
    key: containsDates
- id: zip_codes
  description: The content contains ZIP codes.
  derivedFrom:
  - source: flag_true
    key: containsZipCodes
- id: deid_unconfirmed
  description: De-identification ran, and an independent check has not yet confirmed it. Set by workflows only.
- id: consent_unrecorded
  description: The file's consent elements are not yet recorded in GOVERN's participants table.
  derivedFrom:
  - source: data_class
    classes: [ConsentFile]
- id: deid_confirmed
  description: An independent check confirmed the file's de-identification. Set by workflows only.
- id: sensor_qc_pending
  description: Sensor data that has not yet passed qc_sensory.
  derivedFrom:
  - source: data_class
    classes: [SensorDataFile]
- id: unregistered_modality
  description: "Register: the file's modality is not one the source is registered for."
  derivedFrom:
  - source: modality_not_registered
- id: needs_expert_review
  description: "Register: releases from the source need an expert determination."
  derivedFrom:
  - source: register
    key: deidentificationClass
    anyOf: [expert_determination]

# --- standards ----------------------------------------------------------------
# Order matters: an item takes the first standard listed in its file set's conformsTo.
standards:
- id: fhir_r4
  description: FHIR R4
  url: http://hl7.org/fhir/R4
  classes: [FhirFile]
- id: omop_cdm_54
  description: OMOP CDM 5.4
  url: https://ohdsi.github.io/CommonDataModel/cdm54.html
  classes: [OmopTableFile]
- id: ccda_21
  description: C-CDA 2.1
  url: http://hl7.org/cda/us/ccda/2.1
  classes: [CcdaDocumentFile]
- id: ieee_1752_1
  description: IEEE 1752.1
  url: https://standards.ieee.org/ieee/1752.1/6982/
  classes: [SensorMeasureFile]
- id: ga4gh_vrs_2
  description: GA4GH VRS 2.0
  url: https://vrs.ga4gh.org/en/2.0/
  classes: [VariantFile]
  outputOnly: true

# --- zones ------------------------------------------------------------------
# Each zone belongs to a platform module (INTAKE, NORMALIZE, DISCOVER). From the deposit,
# a file is held for curation or ingested into the de-identification and QC environment,
# from which the lanes load it into the normalized store. GOVERN holds registers, not
# data, so no zone belongs to it: the register facts the rules read are its source
# register, and record workflows write register entries such as consent elements. The TRE is part of DISCOVER: researchers reach released data from it, so no zone
# before release is TRE.
# Zones with a cirroEnvironment are Cirro environments: only Cirro processes write to
# them, and Cirro processes other than ingests read only from them.
zones:
- id: deposit
  description: The raw deposit prefix.
  module: INTAKE
  initial: true
- id: deid_qc
  description: Where de-identification, QC and domain workflows run, in the processing Cirro environment.
  module: INTAKE
  cirroEnvironment: rddc-processing
- id: curation
  description: Files held for a curator to decide what to do with them.
  module: INTAKE
  location: s3://rddc-curation/{sourceId}/{batchId}/{dispatchId}/
- id: normalized
  description: >-
    The normalized, analysis-ready store (OMOP and tables). It shares the processing Cirro
    environment with deid_qc, since Cirro cannot easily move datasets between environments.
  module: NORMALIZE
  cirroEnvironment: rddc-processing
- id: release
  description: The release database, for the protected tier; researchers reach it from the TRE in DISCOVER.
  module: DISCOVER
  location: s3://rddc-release/{sourceId}/{batchId}/{dispatchId}/
- id: public
  description: Open-tier content published outside the security boundary.
  location: s3://rddc-public/{sourceId}/{batchId}/{dispatchId}/

# --- pipeline repositories ----------------------------------------------------
# Our own pipelines, grouped by modality. Release masking has a repository of its own,
# since it runs on every modality. Add the GitHub owner when the repositories exist.
pipelineRepositories:
- id: clinical
  description: De-identification and normalization of clinical data.
  repository: rddc-clinical-pipelines
  repositoryType: GITHUB_PRIVATE
- id: genomics
  description: Genomics normalization.
  repository: rddc-genomics-pipelines
  repositoryType: GITHUB_PRIVATE
- id: imaging
  description: Imaging de-identification.
  repository: rddc-imaging-pipelines
  repositoryType: GITHUB_PRIVATE
- id: sensor
  description: Sensor data QC and normalization.
  repository: rddc-sensor-pipelines
  repositoryType: GITHUB_PRIVATE
- id: release
  description: Release preparation, such as date masking.
  repository: rddc-release-pipelines
  repositoryType: GITHUB_PRIVATE

# --- workflows (DRAFT) ----------------------------------------------------
# Cirro process ids follow Cirro's pattern but are made up. Workflows that write
# outside INTAKE refuse biometric data and data of a modality the source is not
# registered for, and lanes into the normalized store refuse free text that has not been
# de-identified and confirmed. Domain analyses that leave the rules' view of the data unchanged
# (genomics QC, facial phenotyping) run in the de-id/QC environment and are not listed: as
# routing steps they would be cycles.
workflows:
- id: ingest_files
  description: >-
    The one generic step: brings deposited files of any type into the de-id/QC
    environment as a Cirro dataset, unchanged. The Cirro data type depends on the files
    (cirroIngestTypes); every other pipeline is specific to a data type and has its own
    version.
  runner: cirro
  cirroExecutor: INGEST
  cirroIngestTypes:
  # In Cirro: file rules copied from Cirro (2026-11-09). Long reads first, by
  # sequencingPlatform; the short-read types take only short-read platforms.
  - dataType: nanopore_fastq
    classes: [SequenceReadsFile]
    platforms: [oxford_nanopore]
    fileRules:
    - description: Nanopore Sequencing (FASTQ)
      minFiles: 1
      maxFiles: 50000
      fileNamePatterns:
      - {exampleName: 'SampleName.fastq(.gz)', description: 'FASTQ',
         namePattern: '(?P<sampleName>[\S ]*)\.(fq|fastq)(\.gz|)'}
  - dataType: long_read_fastq
    classes: [SequenceReadsFile]
    platforms: [pacbio_smrt, oxford_nanopore]
    fileRules:
    - description: PacBio / Oxford Nanopore FASTQ
      minFiles: 1
      maxFiles: 50000
      fileNamePatterns:
      - {exampleName: 'SampleName.hifi_reads.fastq.gz', description: 'FASTQ (.hifi_reads.fastq.gz)',
         namePattern: '(?P<sampleName>[\S ]*)\.hifi_reads\.(fq|fastq)(\.gz|)'}
      - {exampleName: 'SampleName_R1.fastq.gz', description: 'FASTQ (.fastq.gz)',
         namePattern: '(?P<sampleName>[\S ]*)_R1\.(fq|fastq)(\.gz|)'}
      - {exampleName: 'SampleName_1.fastq.gz', description: 'FASTQ (.fastq.gz)',
         namePattern: '(?P<sampleName>[\S ]*)_1\.(fq|fastq)(\.gz|)'}
      - {exampleName: 'SampleName.fastq.gz', description: 'FASTQ (.fastq.gz)',
         namePattern: '(?P<sampleName>[\S ]*)\.(fq|fastq)(\.gz|)'}
  - dataType: paired_dnaseq
    classes: [SequenceReadsFile]
    techniques: [wgs, wes, targeted_panel, methylation_seq]
    platforms: [illumina, element, dnbseq, ion_torrent, ultima]
    fileRules:
    - description: FASTQ - Unmatched Barcodes
      minFiles: 0
      maxFiles: 50000
      fileNamePatterns:
      - {exampleName: 'Undetermined_S0_R1_001.fastq.gz', description: 'FASTQ (No Barcode Match)',
         namePattern: 'Undetermined\S*\.fastq\.gz'}
    - description: Paired FASTQs (R1/R2)
      minFiles: 2
      maxFiles: 50000
      fileNamePatterns:
      - {exampleName: 'SampleName_R1.fastq.gz', description: 'FASTQ',
         namePattern: '(?P<sampleName>[\S ]*)(\.|_)(?P<readType>R|I|)(?P<read>1|2|3|4)\.(fq|fastq)(\.gz|)'}
      - {exampleName: 'SampleName_L001_R1_001.fastq.gz', description: 'FASTQ (Illumina Format - no sample index)',
         namePattern: '(?P<sampleName>[\S]*)_L(?P<lane>\S*)_(?P<readType>R|I)(?P<read>1|2|3|4)_001\.fastq\.gz'}
      - {exampleName: 'SampleName_S1_L001_R1_001.fastq.gz', description: 'FASTQ (Illumina Format - with lane)',
         namePattern: '(?P<sampleName>\S*)_S(?P<libraryIndex>\S*)_L(?P<lane>\S*)_(?P<readType>R|I)(?P<read>1|2|3|4)_001\.fastq\.gz'}
      - {exampleName: 'SampleName_S1_R1_001.fastq.gz', description: 'FASTQ (Illumina Format - no lane)',
         namePattern: '(?P<sampleName>\S*)_S(?P<libraryIndex>\S*)_(?P<readType>R|I)(?P<read>1|2|3|4)_001\.fastq\.gz'}
  - dataType: rnaseq
    classes: [SequenceReadsFile]
    techniques: [rna_seq]
    platforms: [illumina, element, dnbseq, ion_torrent, ultima]
    fileRules:
    - description: FASTQ - Unmatched Barcodes
      minFiles: 0
      maxFiles: 50000
      fileNamePatterns:
      - {exampleName: 'Undetermined_S0_R1_001.fastq.gz', description: 'FASTQ (No Barcode Match)',
         namePattern: 'Undetermined\S*\.fastq\.gz'}
    - description: Paired FASTQs (R1/R2)
      minFiles: 2
      maxFiles: 50000
      fileNamePatterns:
      - {exampleName: 'SampleName_R1.fastq.gz', description: 'FASTQ',
         namePattern: '(?P<sampleName>[\S ]*)(\.|_)(?P<readType>R|I|)(?P<read>1|2|3|4)\.(fq|fastq)(\.gz|)'}
      - {exampleName: 'SampleName_L001_R1_001.fastq.gz', description: 'FASTQ (Illumina Format - no sample index)',
         namePattern: '(?P<sampleName>[\S]*)_L(?P<lane>\S*)_(?P<readType>R|I)(?P<read>1|2|3|4)_001\.fastq\.gz'}
      - {exampleName: 'SampleName_S1_L001_R1_001.fastq.gz', description: 'FASTQ (Illumina Format - with lane)',
         namePattern: '(?P<sampleName>\S*)_S(?P<libraryIndex>\S*)_L(?P<lane>\S*)_(?P<readType>R|I)(?P<read>1|2|3|4)_001\.fastq\.gz'}
      - {exampleName: 'SampleName_S1_R1_001.fastq.gz', description: 'FASTQ (Illumina Format - no lane)',
         namePattern: '(?P<sampleName>\S*)_S(?P<libraryIndex>\S*)_(?P<readType>R|I)(?P<read>1|2|3|4)_001\.fastq\.gz'}
  - dataType: rnaseq-single
    classes: [SequenceReadsFile]
    techniques: [rna_seq]
    platforms: [illumina, element, dnbseq, ion_torrent, ultima]
    fileRules:
    - description: FASTQ - Unmatched Barcodes
      minFiles: 0
      maxFiles: 50000
      fileNamePatterns:
      - {exampleName: 'Undetermined_S0_R1_001.fastq.gz', description: 'FASTQ (No Barcode Match)',
         namePattern: 'Undetermined\S*\.fastq\.gz'}
    - description: FASTQs
      minFiles: 1
      maxFiles: 50000
      fileNamePatterns:
      - {exampleName: 'SampleName_R1.fastq.gz', description: 'FASTQ',
         namePattern: '(?P<sampleName>[\S ]*)(\.|_)(?P<readType>R|I|)(?P<read>1|2|3|4)\.(fq|fastq)(\.gz|)'}
      - {exampleName: 'SampleName_L001_R1_001.fastq.gz', description: 'FASTQ (Illumina Format - no sample index)',
         namePattern: '(?P<sampleName>[\S]*)_L(?P<lane>\S*)_(?P<readType>R|I)(?P<read>1|2|3|4)_001\.fastq\.gz'}
      - {exampleName: 'SampleName_S1_L001_R1_001.fastq.gz', description: 'FASTQ (Illumina Format - with lane)',
         namePattern: '(?P<sampleName>\S*)_S(?P<libraryIndex>\S*)_L(?P<lane>\S*)_(?P<readType>R|I)(?P<read>1|2|3|4)_001\.fastq\.gz'}
      - {exampleName: 'SampleName_S1_R1_001.fastq.gz', description: 'FASTQ (Illumina Format - no lane)',
         namePattern: '(?P<sampleName>\S*)_S(?P<libraryIndex>\S*)_(?P<readType>R|I)(?P<read>1|2|3|4)_001\.fastq\.gz'}
  - dataType: ingest_unaligned_bam
    classes: [SequenceReadsFile]
    fileRules:
    - description: Unaligned BAMs
      minFiles: 1
      maxFiles: 50000
      fileNamePatterns:
      - {exampleName: 'SampleName.unaligned.bam', description: 'BAM',
         namePattern: '(?P<sampleName>[\S ]*).unaligned.bam'}
      - {exampleName: 'SampleName.bam', description: 'BAM',
         namePattern: '(?P<sampleName>[\S ]*).bam'}
  - dataType: ingest_aligned_bam
    classes: [AlignmentFile, IndexFile]
    fileRules:
    - description: Aligned BAMs
      minFiles: 1
      maxFiles: 50000
      fileNamePatterns:
      - {exampleName: 'SampleName.bam', description: 'BAM',
         namePattern: '(?P<sampleName>[\S ]*).bam'}
      - {exampleName: 'SampleName.bam.bai', description: 'BAM Index',
         namePattern: '(?P<sampleName>[\S ]*).bam.bai'}
  - dataType: ingest_cram
    classes: [AlignmentFile]
    fileRules:
    - description: CRAM Files
      minFiles: 1
      maxFiles: 50000
      fileNamePatterns:
      - {exampleName: 'SampleName.cram', description: 'CRAM',
         namePattern: '(?P<sampleName>[\S ]*).cram'}
  # To add to Cirro: a fallback for a CRAM delivered with its index, which Cirro's
  # ingest_cram does not take. File rules are proposals.
  - dataType: rddc_ingest_cram
    classes: [AlignmentFile, IndexFile]
    fileRules:
    - description: CRAM files
      minFiles: 1
      maxFiles: 50000
      fileNamePatterns:
      - {exampleName: 'SampleName.cram', description: 'CRAM',
         namePattern: '(?P<sampleName>[\S ]*)\.cram'}
    - description: CRAM indexes
      minFiles: 0
      maxFiles: 50000
      fileNamePatterns:
      - {exampleName: 'SampleName.cram.crai', description: 'CRAM index',
         namePattern: '(?P<sampleName>[\S ]*)\.cram\.crai'}
  - dataType: vcf
    classes: [VariantFile]
    fileRules:
    - description: Genomic Variants (VCF)
      minFiles: 1
      maxFiles: 50000
      fileNamePatterns:
      - {exampleName: 'Sample.vcf.gz', description: 'VCF',
         namePattern: '(?P<sampleName>[\S ]*)\.vcf\.gz'}
  # To add to Cirro: a fallback for variant calls Cirro's vcf does not take (an
  # uncompressed VCF, a BCF, or a VCF with its index). File rules are proposals.
  - dataType: rddc_ingest_vcf
    classes: [VariantFile, IndexFile]
    fileRules:
    - description: Variant calls
      minFiles: 1
      maxFiles: 50000
      fileNamePatterns:
      - {exampleName: 'Sample.vcf.gz', description: 'VCF',
         namePattern: '(?P<sampleName>[\S ]*)\.vcf(\.gz)?'}
      - {exampleName: 'Sample.bcf', description: 'BCF',
         namePattern: '(?P<sampleName>[\S ]*)\.bcf'}
    - description: Variant call indexes
      minFiles: 0
      maxFiles: 50000
      fileNamePatterns:
      - {exampleName: 'Sample.vcf.gz.tbi', description: 'Tabix or CSI index',
         namePattern: '(?P<sampleName>[\S ]*)\.(vcf\.gz|bcf)\.(tbi|csi)'}
  # To add to Cirro: file rules are proposals. Facial images come before DICOM so they keep a type of their own.
  - dataType: rddc_ingest_facial_imaging
    classes: [FacialImagingFile]
    fileRules:
    - description: Facial images and 3D scans
      minFiles: 1
      maxFiles: 50000
      fileNamePatterns:
      - {exampleName: 'face.jpg', description: 'Photograph',
         namePattern: '(?P<sampleName>[\S ]*)\.(jpe?g|png|tiff?|heic)'}
      - {exampleName: 'face.dcm', description: 'DICOM',
         namePattern: '(?P<sampleName>[\S ]*)\.dcm'}
      - {exampleName: 'face.obj', description: '3D surface scan',
         namePattern: '(?P<sampleName>[\S ]*)\.(obj|stl|glb|gltf|mtl|ply)'}
  # In Cirro.
  - dataType: ingest_dicom
    classes: [ImagingFile]
    fileRules:
    - description: DICOM Files
      minFiles: 1
      maxFiles: 50000
      fileNamePatterns:
      - {exampleName: 'SampleName.dcm', description: 'DICOM (.dcm)',
         namePattern: '(?P<sampleName>[\S ]*).dcm'}
  # To add to Cirro: file rules are proposals.
  - dataType: rddc_ingest_fhir
    classes: [FhirFile]
    fileRules:
    - description: FHIR resources or bulk export files
      minFiles: 1
      maxFiles: 50000
      fileNamePatterns:
      - {exampleName: 'Patient.ndjson.gz', description: 'NDJSON',
         namePattern: '(?P<sampleName>[\S ]*)\.ndjson(\.gz)?'}
      - {exampleName: 'bundle.json', description: 'JSON',
         namePattern: '(?P<sampleName>[\S ]*)\.json(\.gz)?'}
  - dataType: rddc_ingest_omop
    classes: [OmopTableFile]
    fileRules:
    - description: OMOP CDM tables
      minFiles: 1
      maxFiles: 50000
      fileNamePatterns:
      - {exampleName: 'person.csv', description: 'CSV, TSV or Parquet',
         namePattern: '(?P<sampleName>[\S ]*)\.(csv|tsv|parquet)(\.gz)?'}
  - dataType: rddc_ingest_ccda
    classes: [CcdaDocumentFile]
    fileRules:
    - description: C-CDA documents
      minFiles: 1
      maxFiles: 50000
      fileNamePatterns:
      - {exampleName: 'doc_0000001.xml', description: 'XML',
         namePattern: '(?P<sampleName>[\S ]*)\.xml(\.gz)?'}
  - dataType: rddc_ingest_tabular
    classes: [TabularFile]
    fileRules:
    - description: Tables
      minFiles: 1
      maxFiles: 50000
      fileNamePatterns:
      - {exampleName: 'patients.csv', description: 'CSV, TSV, Parquet or JSON',
         namePattern: '(?P<sampleName>[\S ]*)\.(csv|tsv|parquet|json|jsonl)(\.gz)?'}
  - dataType: rddc_ingest_clinical_documents
    classes: [ClinicalDocumentFile]
    fileRules:
    - description: Clinical documents
      minFiles: 1
      maxFiles: 50000
      fileNamePatterns:
      - {exampleName: 'note_0001.txt', description: 'Text, PDF, RTF or scan',
         namePattern: '(?P<sampleName>[\S ]*)\.(txt|pdf|rtf|tiff?|jpe?g|png)'}
  - dataType: rddc_ingest_consent
    classes: [ConsentFile]
    fileRules:
    - description: Consent records
      minFiles: 1
      maxFiles: 50000
      fileNamePatterns:
      - {exampleName: 'consent.csv', description: 'CSV, TSV or JSON',
         namePattern: '(?P<sampleName>[\S ]*)\.(csv|tsv|json|jsonl)'}
  - dataType: rddc_ingest_sensor
    classes: [SensorDataFile]
    fileRules:
    - description: Sensor signals and measures
      minFiles: 1
      maxFiles: 50000
      fileNamePatterns:
      - {exampleName: 'recording.edf', description: 'Any file (sensor formats are not agreed yet)',
         namePattern: '(?P<sampleName>[\S ]*)'}
  - dataType: rddc_ingest_imaging
    classes: [ImagingFile]
    fileRules:
    - description: Images
      minFiles: 1
      maxFiles: 50000
      fileNamePatterns:
      - {exampleName: 'slide.tiff', description: 'Image',
         namePattern: '(?P<sampleName>[\S ]*)\.(tiff?|jpe?g|png|svs|ndpi|czi|nii(\.gz)?)'}
  - dataType: rddc_ingest_audio
    classes: [AudioFile]
    fileRules:
    - description: Audio recordings
      minFiles: 1
      maxFiles: 50000
      fileNamePatterns:
      - {exampleName: 'interview.wav', description: 'Audio',
         namePattern: '(?P<sampleName>[\S ]*)\.(wav|flac|mp3|m4a|ogg|aac)'}
  - dataType: rddc_ingest_video
    classes: [VideoFile]
    fileRules:
    - description: Video recordings
      minFiles: 1
      maxFiles: 50000
      fileNamePatterns:
      - {exampleName: 'session.mp4', description: 'Video',
         namePattern: '(?P<sampleName>[\S ]*)\.(mp4|mov|avi|mkv|webm)'}
  pipelineVersion: 0.0.0
  kind: ingest
  consumes: {}
  readsFrom: [deposit]
  writesTo: deid_qc
- id: fhir_to_omop
  description: Lane 2. Transforms a FHIR R4 export to OMOP CDM 5.4 and loads it.
  runner: cirro
  cirroProcess: process-rddc-fhir-to-omop-0_0
  cirroExecutor: NEXTFLOW
  cirroAvailability: to_add
  pipelineRepository: clinical
  pipelineName: fhir_to_omop
  pipelineVersion: 0.0.0
  kind: transform
  operation: EDAM:operation_0335
  consumes:
    classes: [FhirFile]
    standards: [fhir_r4]
    noProperties: [free_text, deid_unconfirmed, biometric, unregistered_modality]
  produces: OmopTableFile
  producesStandard: omop_cdm_54
  readsFrom: [deid_qc]
  writesTo: normalized
  parameters:
  - id: source_id
    fromSidecar: batch.sourceId
  - id: fhir_version
    value: R4
- id: omop_load
  description: Lane 1. Loads an OMOP CDM 5.4 instance.
  runner: cirro
  cirroProcess: process-rddc-omop-load-0_0
  cirroExecutor: NEXTFLOW
  cirroAvailability: to_add
  pipelineRepository: clinical
  pipelineName: omop_load
  pipelineVersion: 0.0.0
  kind: load
  consumes:
    classes: [OmopTableFile]
    standards: [omop_cdm_54]
    fileSetClasses: [OmopCdmInstance]
    noProperties: [free_text, deid_unconfirmed, biometric, unregistered_modality]
  readsFrom: [deid_qc]
  writesTo: normalized
  parameters:
  - id: vocabulary_version
    fromSidecar: fileSet.vocabularyVersion
- id: ccda_to_omop
  description: Lane 3. Transforms C-CDA 2.1 documents to OMOP CDM 5.4.
  runner: cirro
  cirroProcess: process-rddc-ccda-to-omop-0_0
  cirroExecutor: CROMWELL
  cirroAvailability: to_add
  pipelineRepository: clinical
  pipelineName: ccda_to_omop
  pipelineVersion: 0.0.0
  kind: transform
  operation: EDAM:operation_0335
  consumes:
    classes: [CcdaDocumentFile]
    standards: [ccda_21]
    noProperties: [free_text, deid_unconfirmed, biometric, unregistered_modality]
  produces: OmopTableFile
  producesStandard: omop_cdm_54
  readsFrom: [deid_qc]
  writesTo: normalized
- id: deid_fhir
  description: >-
    Removes identifiers from free text in FHIR resources: narrative, notes and other string fields. Output stays FHIR R4. Runs once per file, also on files of the same file set that need no
    de-identification themselves, so that the set moves together.
  runner: cirro
  cirroProcess: process-rddc-fhir-deid-0_0
  cirroExecutor: NEXTFLOW
  cirroAvailability: to_add
  pipelineRepository: clinical
  pipelineName: fhir_deid
  pipelineVersion: 0.0.0
  kind: deidentify
  operation: EDAM:operation_3283
  consumes:
    classes: [FhirFile]
    noProperties: [identifying, deid_unconfirmed, deid_confirmed]
  readsFrom: [deid_qc]
  writesTo: deid_qc
  clears: [free_text, direct_identifiers]
  sets: [deid_unconfirmed]
  parameters:
  - id: deid_class
    fromSourceRegister: deidentificationClass
- id: deid_ccda
  description: >-
    Removes identifiers from the narrative sections of C-CDA documents. Output stays C-CDA. Runs once per file, also on files of the same file set that need no
    de-identification themselves, so that the set moves together.
  runner: cirro
  cirroProcess: process-rddc-ccda-deid-0_0
  cirroExecutor: NEXTFLOW
  cirroAvailability: to_add
  pipelineRepository: clinical
  pipelineName: ccda_deid
  pipelineVersion: 0.0.0
  kind: deidentify
  operation: EDAM:operation_3283
  consumes:
    classes: [CcdaDocumentFile]
    noProperties: [identifying, deid_unconfirmed, deid_confirmed]
  readsFrom: [deid_qc]
  writesTo: deid_qc
  clears: [free_text, direct_identifiers]
  sets: [deid_unconfirmed]
  parameters:
  - id: deid_class
    fromSourceRegister: deidentificationClass
- id: deid_tabular
  description: >-
    Removes identifiers from free-text columns of registry and other tables. Runs once per file, also on files of the same file set that need no
    de-identification themselves, so that the set moves together.
  runner: cirro
  cirroProcess: process-rddc-tabular-deid-0_0
  cirroExecutor: NEXTFLOW
  cirroAvailability: to_add
  pipelineRepository: clinical
  pipelineName: tabular_deid
  pipelineVersion: 0.0.0
  kind: deidentify
  operation: EDAM:operation_3283
  consumes:
    classes: [TabularFile]
    noProperties: [identifying, deid_unconfirmed, deid_confirmed]
  readsFrom: [deid_qc]
  writesTo: deid_qc
  clears: [free_text, direct_identifiers]
  sets: [deid_unconfirmed]
  parameters:
  - id: deid_class
    fromSourceRegister: deidentificationClass
- id: deid_clinical_documents
  description: >-
    Removes identifiers from clinical notes and scanned reports (text and OCR). Runs once per file, also on files of the same file set that need no
    de-identification themselves, so that the set moves together.
  runner: cirro
  cirroProcess: process-rddc-clinical-document-deid-0_0
  cirroExecutor: NEXTFLOW
  cirroAvailability: to_add
  pipelineRepository: clinical
  pipelineName: clinical_document_deid
  pipelineVersion: 0.0.0
  kind: deidentify
  operation: EDAM:operation_3283
  consumes:
    classes: [ClinicalDocumentFile]
    noProperties: [identifying, deid_unconfirmed, deid_confirmed]
  readsFrom: [deid_qc]
  writesTo: deid_qc
  clears: [free_text, direct_identifiers]
  sets: [deid_unconfirmed]
  parameters:
  - id: deid_class
    fromSourceRegister: deidentificationClass
- id: deid_omop_notes
  description: >-
    Removes identifiers from the free text of a deposited OMOP CDM instance (note and note_nlp tables). Runs once per file, also on files of the same file set that need no
    de-identification themselves, so that the set moves together.
  runner: cirro
  cirroProcess: process-rddc-omop-note-deid-0_0
  cirroExecutor: NEXTFLOW
  cirroAvailability: to_add
  pipelineRepository: clinical
  pipelineName: omop_note_deid
  pipelineVersion: 0.0.0
  kind: deidentify
  operation: EDAM:operation_3283
  consumes:
    classes: [OmopTableFile]
    noProperties: [identifying, deid_unconfirmed, deid_confirmed]
  readsFrom: [deid_qc]
  writesTo: deid_qc
  clears: [free_text, direct_identifiers]
  sets: [deid_unconfirmed]
  parameters:
  - id: deid_class
    fromSourceRegister: deidentificationClass
- id: confirm_deid
  description: >-
    Confirms de-identification, after the pipeline for the file's data type, with Amazon
    Comprehend Medical PHI detection (an asynchronous job over the files in S3). The dispatcher reports any PHI found as
    the free_text and direct_identifiers properties, which blocks the file for a person.
  runner: service
  pipeline: aws:comprehendmedical:StartPHIDetectionJob
  pipelineVersion: "2018-10-30"
  kind: confirm
  consumes:
    anyProperties: [deid_unconfirmed]
  readsFrom: [deid_qc]
  writesTo: deid_qc
  clears: [deid_unconfirmed]
  sets: [deid_confirmed]
  parameters:
  - id: language_code
    value: en
  - id: data_access_role_arn
    value: arn:aws:iam::000000000000:role/rddc-comprehend-medical
  - id: output_s3_uri
    value: s3://rddc-deid-reports/{sourceId}/{batchId}/{dispatchId}/
- id: tabular_load
  description: Lane 4. Loads other tables and de-identified documents.
  runner: cirro
  cirroProcess: process-rddc-tabular-load-0_0
  cirroExecutor: NEXTFLOW
  cirroAvailability: to_add
  pipelineRepository: clinical
  pipelineName: tabular_load
  pipelineVersion: 0.0.0
  kind: load
  consumes:
    classes: [TabularFile, ClinicalDocumentFile]
    noProperties: [free_text, deid_unconfirmed, biometric, unregistered_modality]
  readsFrom: [deid_qc]
  writesTo: normalized
- id: record_consent
  description: >-
    Matches the consent elements in a consent file to persons by PPRL linkage ID and
    writes them to GOVERN's participants table. The file stays in INTAKE.
  runner: service
  pipeline: https://govern.example/participants-table
  pipelineVersion: 0.0.0
  kind: record
  recordsTo: participants table
  consumes:
    classes: [ConsentFile]
    anyProperties: [consent_unrecorded]
  readsFrom: [deid_qc]
  writesTo: deid_qc
  clears: [consent_unrecorded]
- id: imaging_deid
  description: Removes identifiers from DICOM headers. Not for facial images.
  runner: cirro
  cirroProcess: process-rddc-imaging-deid-0_0
  cirroExecutor: NEXTFLOW
  cirroAvailability: to_add
  pipelineRepository: imaging
  pipelineName: imaging_deid
  pipelineVersion: 0.0.0
  kind: deidentify
  operation: EDAM:operation_3283
  consumes:
    classes: [ImagingFile]
    anyProperties: [direct_identifiers]
    noProperties: [biometric]
  readsFrom: [deid_qc]
  writesTo: deid_qc
  clears: [direct_identifiers]
- id: vcf_to_vrs
  description: >-
    Normalization requirement: represents the variant calls in a VCF as GA4GH VRS 2.0
    alleles with computed identifiers, and loads them into the normalized store.
  runner: cirro
  cirroProcess: process-rddc-vcf-to-vrs-0_0
  cirroExecutor: NEXTFLOW
  cirroAvailability: to_add
  pipelineRepository: genomics
  pipelineName: vcf_to_vrs
  pipelineVersion: 0.0.0
  kind: transform
  operation: EDAM:operation_0335
  consumes:
    classes: [VariantFile]
    noProperties: [free_text, deid_unconfirmed, biometric, unregistered_modality]
  producesStandard: ga4gh_vrs_2
  readsFrom: [deid_qc]
  writesTo: normalized
  parameters:
  - id: vrs_version
    value: "2.0"
- id: qc_sensory
  description: >-
    Quality control for sensor data (signals and measures): checks completeness,
    sampling and device metadata. The only INTAKE pipeline for sensor data; it has no
    de-identification pipeline.
  runner: cirro
  cirroProcess: process-rddc-qc-sensory-0_0
  cirroExecutor: NEXTFLOW
  cirroAvailability: to_add
  pipelineRepository: sensor
  pipelineName: qc_sensory
  pipelineVersion: 0.0.0
  kind: qc
  consumes:
    classes: [SensorDataFile]
    anyProperties: [sensor_qc_pending]
  readsFrom: [deid_qc]
  writesTo: deid_qc
  clears: [sensor_qc_pending]
- id: sensor_to_measures
  description: Derives measures (IEEE 1752.1) from raw sensor signals.
  runner: cirro
  cirroProcess: process-rddc-sensor-to-measures-0_0
  cirroExecutor: CROMWELL
  cirroAvailability: to_add
  pipelineRepository: sensor
  pipelineName: sensor_to_measures
  pipelineVersion: 0.0.0
  kind: transform
  operation: EDAM:operation_0335
  consumes:
    classes: [SensorSignalFile]
    noProperties: [sensor_qc_pending]
  produces: SensorMeasureFile
  producesStandard: ieee_1752_1
  readsFrom: [deid_qc]
  writesTo: deid_qc
- id: sensor_load
  description: Loads sensor measures.
  runner: cirro
  cirroProcess: process-rddc-sensor-load-0_0
  cirroExecutor: NEXTFLOW
  cirroAvailability: to_add
  pipelineRepository: sensor
  pipelineName: sensor_load
  pipelineVersion: 0.0.0
  kind: load
  consumes:
    classes: [SensorMeasureFile]
    noProperties: [free_text, deid_unconfirmed, sensor_qc_pending, biometric, unregistered_modality]
  readsFrom: [deid_qc]
  writesTo: normalized
- id: curation_hold
  description: Holds a file for a curator.
  runner: service
  pipeline: https://synapse.example/curation-queue
  pipelineVersion: 0.0.0
  kind: hold
  priority: 9
  consumes: {}
  readsFrom: [deposit]
  writesTo: curation
- id: release_mask_shift
  description: "Register: shifts dates by a per-person offset and truncates ZIP codes to 3 digits."
  runner: cirro
  cirroProcess: process-rddc-release-mask-0_0
  cirroExecutor: NEXTFLOW
  cirroAvailability: to_add
  pipelineRepository: release
  pipelineName: release_mask
  pipelineVersion: 0.0.0
  kind: mask
  operation: EDAM:operation_3283
  consumes:
    classes: [OmopTableFile, TabularFile, ClinicalDocumentFile, SensorMeasureFile]
    anyProperties: [dates, zip_codes]
    sourceFacts:
    - field: datePolicy
      anyOf: [shift]
  readsFrom: [normalized]
  writesTo: normalized
  clears: [dates, zip_codes]
  parameters:
  - id: date_mode
    value: shift
- id: release_mask_year
  description: "Register: reduces dates to the year and truncates ZIP codes to 3 digits."
  runner: cirro
  cirroProcess: process-rddc-release-mask-0_0
  cirroExecutor: NEXTFLOW
  cirroAvailability: to_add
  pipelineRepository: release
  pipelineName: release_mask
  pipelineVersion: 0.0.0
  kind: mask
  operation: EDAM:operation_3283
  consumes:
    classes: [OmopTableFile, TabularFile, ClinicalDocumentFile, SensorMeasureFile]
    anyProperties: [dates, zip_codes]
    sourceFacts:
    - field: datePolicy
      anyOf: [year_only]
  readsFrom: [normalized]
  writesTo: normalized
  clears: [dates, zip_codes]
  parameters:
  - id: date_mode
    value: year
- id: expert_determination
  description: "Register: an expert determination of re-identification risk. Records a decision; writes no data."
  runner: service
  pipeline: https://expert-determination.example/request
  pipelineVersion: 0.0.0
  kind: expert_review
  consumes:
    anyProperties: [needs_expert_review]
  readsFrom: [normalized]
  writesTo: normalized
  clears: [needs_expert_review]
- id: publish
  description: Copies analysis-ready data to the release database.
  runner: container
  pipeline: registry.example/rddc/publish:0.0.0
  pipelineVersion: 0.0.0
  kind: publish
  consumes:
    classes: [OmopTableFile, TabularFile, ClinicalDocumentFile, SensorMeasureFile]
    noProperties: [direct_identifiers, identifying, biometric, free_text, dates, zip_codes,
                   deid_unconfirmed, unregistered_modality, needs_expert_review]
  readsFrom: [normalized]
  writesTo: release
- id: publish_open
  description: "Register: publishes released data of Open-tier sources whose use terms allow it."
  runner: container
  pipeline: registry.example/rddc/publish-open:0.0.0
  pipelineVersion: 0.0.0
  kind: publish
  consumes:
    sourceFacts:
    - field: accessTier
      anyOf: [open]
    - field: useTerms
      anyOf: ["DUO:0000004", "DUO:0000042"]
  readsFrom: [release]
  writesTo: public
- id: withdraw_subjects
  description: Removes the listed subjects' data and everything derived from it.
  runner: service
  pipeline: https://govern.example/withdraw
  pipelineVersion: 0.0.0
  kind: withdraw
  coversZones: [deposit, deid_qc, curation, normalized, release, public]
  parameters:
  - id: notice
    fromSidecar: batch.noticeRef
  - id: subjects
    fromSidecar: batch.subjects
- id: restrict_subjects
  description: Restricts use of the listed subjects' data.
  runner: service
  pipeline: https://govern.example/restrict
  pipelineVersion: 0.0.0
  kind: restrict
  coversZones: [deposit, deid_qc, curation, normalized, release, public]
  parameters:
  - id: notice
    fromSidecar: batch.noticeRef
  - id: subjects
    fromSidecar: batch.subjects

# --- targets (seed rules 2, 3, 4, 5, 6, 8; normalization requirements) ---------
targets:
- id: unregistered
  when: {anyProperties: [unregistered_modality]}
  goalZone: curation
  priority: 0
- id: fhir_to_omop
  description: Seed rule 2.
  when: {classes: [FhirFile], standards: [fhir_r4], noProperties: [biometric]}
  goalClasses: [OmopTableFile]
  goalStandard: omop_cdm_54
  goalZone: normalized
  priority: 1
- id: omop_load
  description: Seed rule 3.
  when: {classes: [OmopTableFile], standards: [omop_cdm_54], fileSetClasses: [OmopCdmInstance], noProperties: [biometric]}
  goalClasses: [OmopTableFile]
  goalZone: normalized
  priority: 1
- id: ccda
  description: Seed rule 4 (lane 3).
  when: {classes: [CcdaDocumentFile], standards: [ccda_21], noProperties: [biometric]}
  goalClasses: [OmopTableFile]
  goalZone: normalized
  priority: 1
- id: tables_and_text
  description: Seed rule 5 (lane 4).
  when: {classes: [TabularFile, ClinicalDocumentFile], noProperties: [identifying, biometric]}
  goalZone: normalized
  priority: 1
- id: consent
  description: >-
    Seed rule 6. record_consent writes the consent elements to GOVERN's participants
    table; the file stays out of the clinical lanes.
  when: {classes: [ConsentFile], noProperties: [biometric]}
  goalNoProperties: [consent_unrecorded]
  goalZone: deid_qc
  priority: 1
- id: vrs
  description: Normalization requirement.
  when: {classes: [VariantFile], noProperties: [biometric, free_text]}
  goalClasses: [VariantFile]
  goalStandard: ga4gh_vrs_2
  goalZone: normalized
  priority: 1
- id: genomics
  description: For omics workflows. Includes variant files the vrs target does not take.
  when: {classes: [GenomicsFile, IndexFile]}
  goalZone: deid_qc
  priority: 2
- id: imaging
  description: For imaging workflows.
  when: {classes: [ImagingFile], noProperties: [biometric]}
  goalNoProperties: [direct_identifiers]
  goalZone: deid_qc
  priority: 1
- id: facial
  description: For facial phenotyping.
  when: {classes: [FacialImagingFile]}
  goalZone: deid_qc
  priority: 1
- id: media
  description: >-
    A recording of a voice or face contains biometric identifiers, which INTAKE may
    hold.
  when: {classes: [AudioFile, VideoFile]}
  goalZone: deid_qc
  priority: 1
- id: sensor
  description: Seed rule 8.
  when: {classes: [SensorDataFile], noProperties: [biometric, free_text]}
  goalClasses: [SensorMeasureFile]
  goalZone: normalized
  priority: 1
- id: curation
  description: >-
    A deliberate terminal state, not a gap. It catches, for example, clinical files
    flagged (or not stated not) to contain biometric identifiers.
  when: {}
  goalZone: curation
  priority: 9

# --- obligations and prohibitions (seed rules 1, 5, 7; register) ----------------
obligations:
- id: deidentify_before_release
  description: Seed rule 1.
  when: {anyProperties: [identifying, direct_identifiers, biometric]}
  requiredKind: deidentify
  beforeZones: [release, public]
- id: text_deid_before_loading
  description: >-
    Seed rule 5, extended from lane 4 to every lane, so that FHIR narrative and notes,
    and C-CDA sections, do not reach the OMOP note table unde-identified.
  when: {anyProperties: [free_text]}
  requiredKind: deidentify
  beforeZones: [normalized, release, public]
- id: confirm_deid_before_loading
  description: The check is Amazon Comprehend Medical PHI detection (confirm_deid).
  when: {anyProperties: [deid_unconfirmed]}
  requiredKind: confirm
  beforeZones: [normalized, release, public]
- id: sensor_qc_before_loading
  when: {anyProperties: [sensor_qc_pending]}
  requiredKind: qc
  beforeZones: [normalized]
- id: mask_before_release
  description: Seed rule 7. Which masking workflow runs depends on the source's date policy.
  when: {anyProperties: [dates, zip_codes]}
  requiredKind: mask
  beforeZones: [release, public]
- id: expert_review_before_release
  when: {anyProperties: [needs_expert_review]}
  requiredKind: expert_review
  beforeZones: [release, public]

prohibitions:
- id: biometric_stays_in_intake
  description: Seed rule 1.
  when: {anyProperties: [biometric]}
  zones: [normalized, release, public]
- id: consent_not_clinical
  description: Seed rule 6.
  when: {classes: [ConsentFile]}
  zones: [normalized, release, public]
- id: unregistered_stays_in_intake
  description: Until a curator decides.
  when: {anyProperties: [unregistered_modality]}
  zones: [normalized, release, public]
- id: only_open_tier_is_public
  when:
    sourceFacts:
    - field: accessTier
      noneOf: [open]
  zones: [public]

# --- interactions (seed rule 9) ------------------------------------------------
# Seed rule 10 (synthetic batches follow the same routes) holds by construction:
# no property or condition reads the synthetic flag, and check_rules.py fails if one does.
interactionRules:
- interaction: withdraw
  workflow: withdraw_subjects
- interaction: restrict
  workflow: restrict_subjects
