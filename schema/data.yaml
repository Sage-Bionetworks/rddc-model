prefixes:
  rddc: https://w3id.org/rddc/vocab/
  linkml: https://w3id.org/linkml/
  sc: https://schema.org/
  cr: http://mlcommons.org/croissant/
  dct: http://purl.org/dc/terms/
  prov: http://www.w3.org/ns/prov#
  fhir: http://hl7.org/fhir/
  EDAM: http://edamontology.org/
  OBI: http://purl.obolibrary.org/obo/OBI_
  NCIT: http://purl.obolibrary.org/obo/NCIT_
  SNOMEDCT: http://identifiers.org/snomedct/
  rai: http://mlcommons.org/croissant/RAI/
  LOINC: https://loinc.org/
default_prefix: rddc
default_range: string

imports:
- linkml:types
- core

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
types:
  RelativePath:
    uri: xsd:string
    typeof: string
    description: >-
      An object key relative to the batch prefix. Segments are separated by single
      forward slashes, with no leading or trailing slash, no backslashes and no '.' or
      '..' segments.
    pattern: "^(?!(.*/)?\\.\\.?(/|$))[^/\\\\]+(/[^/\\\\]+)*$"
  MediaType:
    uri: xsd:string
    typeof: string
    description: An IANA media type, without parameters.
    pattern: "^[a-z]+/[A-Za-z0-9.+_-]+$"
  ByteSize:
    uri: xsd:string
    typeof: string
    description: A Croissant contentSize in bytes, written "<integer> B".
    pattern: "^[0-9]+ B$"

# ---------------------------------------------------------------------------
# Enumerations
# ---------------------------------------------------------------------------
enums:

  CompressionEnum:
    description: >-
      Compression applied to the file's bytes. encodingFormat names the media
      type of the content after decompression. Croissant has no compression
      property; generic Croissant tools ignore this term.
    permissible_values:
      gzip:
        description: gzip (RFC 1952).
      bgzf:
        description: >-
          Blocked GNU Zip Format, the gzip-compatible block compression of htslib. A
          BGZF file reads as gzip, but only BGZF can carry a tabix or CSI index, so a
          .vcf.gz written by bgzip declares bgzf and one written by gzip declares gzip.
      bzip2:
      xz:
      zstd:

  ModalityEnum:
    description: >-
      The kinds of data a source registers to deposit: the values of the "modality"
      class annotation. Each concrete data file class has exactly one, so a sidecar does
      not state it; the platform reads it from the file's class and checks it against
      the source register. How a file is processed follows from its class, not from
      its modality.
    permissible_values:
      clinical_fhir:
        description: HL7 FHIR resources.
      clinical_omop:
        description: OMOP CDM tables.
      clinical_ccda:
        description: HL7 C-CDA documents.
      clinical_tabular:
        description: Registry, patient-reported, claims or mortality tables not in OMOP or FHIR form (TabularFile).
      clinical_text:
        description: Unstructured clinical text such as notes. De-identified before use.
      consent:
        description: Consent elements for subjects (ConsentFile).
      intake_form:
        description: Responses to patient intake forms, read with the form's definition (IntakeFormFile).
      genetic_testing:
        description: >-
          Results of clinical genetic tests and molecular pathology, as reported to the
          clinician (GeneticTestResultFile).
      diagnosis_support:
        description: >-
          Candidate diagnoses ranked by a decision support tool, not confirmed diagnoses
          (DifferentialDiagnosisFile).
      genomics:
        description: >-
          Sequencing reads, alignments, variant calls, gene expression quantifications
          and related indexes.
      imaging:
        description: Medical images such as DICOM.
      video:
        description: Video recordings (VideoFile).
      audio:
        description: Audio recordings, including voice (AudioFile).
      sensor:
        description: >-
          Data from wearables and other sensor devices: raw signals (the
          SensorSignalFile classes) and measures derived from them (SensorMeasureFile).
      metadata:
        description: Files that describe other files, such as data dictionaries or acquisition metadata (DocumentationFile).
      other:
        description: >-
          Other data (GenericFile). Strongly discouraged: a dedicated data class
          is required; using GenericFile triggers lengthy manual review.

