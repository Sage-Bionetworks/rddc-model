        meaning: NCIT:C198843
        aliases:
        - PPG
      pulse_oximetry:
        title: Pulse oximetry
        description: Estimates of blood oxygen saturation (SpO2).
        meaning: NCIT:C38085
      cgm:
        title: Continuous glucose monitoring
        description: Interstitial glucose measured continuously by a sensor under the skin.
        meaning: SNOMEDCT:439926003
        aliases:
        - CGM
      eeg:
        title: Electroencephalography
        description: Electrical activity of the brain.
        meaning: OBI:0002186
        aliases:
        - EEG
      emg:
        title: Electromyography
        description: Electrical activity of skeletal muscle.
        meaning: NCIT:C38056
        aliases:
        - EMG
      blood_pressure:
        title: Blood pressure measurement
        description: Systolic and diastolic blood pressure, by cuff or continuous sensor.
        meaning: NCIT:C167233
      temperature:
        title: Body temperature measurement
        description: Skin or core body temperature.
        meaning: OBI:0003080
      respiration:
