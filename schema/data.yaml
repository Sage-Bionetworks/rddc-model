  ReferenceGenomeEnum:
    description: >-
      Human reference assemblies accepted in a deposit. UCSC builds use the matching
      GRC assembly: hg19 is GRCh37 and hg38 is GRCh38.
    permissible_values:
      GRCh37:
        description: Genome Reference Consortium human build 37 (hg19).
      GRCh38:
        description: Genome Reference Consortium human build 38 (hg38).
      T2T-CHM13v2.0:
        description: Telomere-to-Telomere CHM13 assembly, version 2.0 (hs1).

  GenomicsAssayEnum:
    description: >-
      Sequencing assays accepted for genomics files. Meanings are OBI assay terms (OBI
      release 2026-07-27). OBI has no term for targeted gene panels, so that value has no
      meaning. The sequencing platform (short-read, long-read) goes in sequencingPlatform,
      not here.
    permissible_values:
      wgs:
        title: Whole genome sequencing
        description: Sequencing of the complete genome.
        meaning: OBI:0002117
        aliases:
        - WGS
      wes:
        title: Exome sequencing
        description: Sequencing of the protein-coding regions of the genome.
        meaning: OBI:0002118
        aliases:
        - WES
        - Whole exome sequencing
      targeted_panel:
        title: Targeted gene panel sequencing
        description: >-
          Sequencing of a selected set of genes or regions, such as a clinical gene
          panel, by hybrid capture or amplicons. OBI has no term covering both; its
          nearest is DNA sequencing assay (OBI:0000626).
      rna_seq:
        title: RNA-Seq
        description: Sequencing of RNA (cDNA) to measure the transcriptome of a sample.
        meaning: OBI:0001271
        aliases:
        - RNA sequencing
      methylation_seq:
        title: Methylation sequencing
        description: >-
          Sequencing that determines the methylation state of DNA, such as whole-genome
          bisulfite sequencing.
        meaning: OBI:0001266
        aliases:
        - WGBS
        - Bisulfite sequencing
      other:
        title: Other sequencing assay
        description: >-
          A sequencing assay not listed here. Name it in the file's description; a
          curator decides whether it needs its own value.

  SequencingPlatformEnum:
    description: >-
      Sequencing technologies, from the INSDC platform types that ENA and SRA use for
      submissions (PlatformType in the SRA schema; values lower-cased). Each value is
      annotated with the read length it produces: short reads of a few hundred bases, or
      long reads of thousands of bases or more. Long reads need different processing. The
      instrument model, such as "Illumina NovaSeq X", goes in platform.
    permissible_values:
      illumina:
        title: Illumina
        description: Illumina sequencing by synthesis, e.g. NovaSeq, NextSeq, MiSeq.
        aliases:
        - ILLUMINA
        annotations: {readLength: short}
      element:
        title: Element Biosciences
        description: Element Biosciences avidity sequencing, e.g. AVITI.
        aliases:
        - ELEMENT
        - AVITI
        annotations: {readLength: short}
      dnbseq:
        title: DNBSEQ (MGI, BGI)
        description: DNA nanoball sequencing by MGI and BGI, e.g. DNBSEQ-G400, BGISEQ-500.
        aliases:
        - DNBSEQ
        - BGISEQ
        annotations: {readLength: short}
      ion_torrent:
        title: Ion Torrent
        description: Ion Torrent semiconductor sequencing, e.g. Ion GeneStudio S5.
        aliases:
        - ION_TORRENT
        annotations: {readLength: short}
      ultima:
        title: Ultima Genomics
        description: Ultima Genomics sequencing, e.g. UG 100.
        aliases:
        - ULTIMA
        annotations: {readLength: short}
      pacbio_smrt:
        title: PacBio SMRT
        description: Pacific Biosciences single-molecule real-time sequencing, e.g. Revio, Sequel II (HiFi reads).
        aliases:
        - PACBIO_SMRT
        - PacBio
        annotations: {readLength: long}
      oxford_nanopore:
        title: Oxford Nanopore
        description: Oxford Nanopore sequencing, e.g. PromethION, GridION, MinION.
        aliases:
        - OXFORD_NANOPORE
        - ONT
        annotations: {readLength: long}
      other:
        title: Other sequencing platform
        description: >-
          A platform not listed here. Name it in platform and the file's description; a
          curator decides whether it needs its own value.

  ImagingAssayEnum:
    description: >-
      Imaging techniques accepted for imaging files. Meanings are OBI assay terms
      (release 2026-07-27) where OBI has one, and NCIT (26.02d) or SNOMED CT terms where
      it does not: OBI has no terms for X-ray radiography, ultrasound or photography. 3D
      surface scanning has no exact term in any of them, so it has mappings only.
    permissible_values:
      photography:
        title: Photography
        description: >-
          Two-dimensional clinical photographs taken with a camera. Facial photographs use
          FacialImagingFile.
        meaning: SNOMEDCT:169283005
        close_mappings:
        - NCIT:C94527
      surface_scan_3d:
        title: 3D surface scanning
        description: >-
          A three-dimensional model of a body surface, such as the face, captured by
          stereophotogrammetry, structured light or laser scanning. No term covers these
          methods together: NCIT's Laser Surface Scan names one of them, and its
          Three-Dimensional Imaging also covers 3D CT and MRI.
        close_mappings:
        - NCIT:C190554
        broad_mappings:
        - NCIT:C18485
      x_ray:
        title: X-ray radiography
        description: Projection images formed by X-rays passing through the body.
        meaning: NCIT:C38101
      ct:
        title: Computed tomography
        description: Cross-sectional images built from a series of X-ray images.
        meaning: OBI:0002986
        aliases:
        - CT
      mri:
        title: Magnetic resonance imaging
        description: Images of the body's interior made with nuclear magnetic resonance.
        meaning: OBI:0002985
        aliases:
        - MRI
      ultrasound:
        title: Ultrasound imaging
        description: Images made with high-frequency sound waves.
        meaning: NCIT:C17230
      pet:
        title: Positron emission tomography
        description: Images of functional processes made with positron-emitting tracers.
        meaning: OBI:0002987
        aliases:
        - PET
      microscopy:
        title: Microscopy
        description: Magnified images from a microscope, such as histology slides.
        meaning: OBI:0002119
      other:
        title: Other imaging technique
        description: >-
          An imaging technique not listed here. Name it in the file's description; a
          curator decides whether it needs its own value. The general term is imaging
          assay (OBI:0000185).

  SensorAssayEnum:
    description: >-
      Sensing techniques accepted for sensor data. Meanings are NCIT (26.02d) terms, OBI
      assay terms (release 2026-07-27) where OBI has one, and SNOMED CT for continuous
