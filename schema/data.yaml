# ---------------------------------------------------------------------------
# Classes
# ---------------------------------------------------------------------------
classes:

  DataFile:
    is_a: FileObject
    abstract: true
    description: A data object of the batch, with modality, subjects, sensitivity and provenance.
    slots:
    - modality
    - subjectIds
    - recordCount
    - identifier
    - sensitivity
    - processingHints
    - wasDerivedFrom
    slot_usage:
      modality:
        required: true
      sensitivity:
        range: FileSensitivity
      wasDerivedFrom:
        description: "References to input files in this sidecar, such as the alignment used to call variants."

  ProcessingHint:
    class_uri: sc:PropertyValue
    description: >-
      An informational key-value pair for a pipeline. Any value used to make a pipeline
      decision must be a defined schema field.
    slots:
    - type
    - propertyID
    - value
    slot_usage:
      type:
        equals_string: sc:PropertyValue
      propertyID:
        required: true
        pattern: "^[a-z][a-z0-9_]*:[a-z][a-z0-9_.]*$"
        description: Namespaced key, e.g. "fhir_to_omop:source_vocabulary".
      value:
        required: true

  # --- clinical -------------------------------------------------------------

  FhirFile:
    is_a: DataFile
    abstract: true
    description: >-
      Base class for FHIR JSON files. It records the FHIR version and the implementation
      guide packages, which a FHIR validator needs to check the resources.
    slots:
    - fhirVersion
    - implementationGuides
    slot_usage:
      fhirVersion:
        required: true

  FhirBundleFile:
    is_a: FhirFile
    description: One FHIR Bundle JSON document.
    annotations:
      structure: structured
    slots:
    - bundleType
    slot_usage:
      encodingFormat:
        range: string  # equals_string needs a string range; the fixed value is a valid MediaType
        equals_string: application/fhir+json
      bundleType:
        required: true
      subjectIds:
        required: true

  FhirResourceFile:
    is_a: FhirFile
    description: One FHIR resource JSON document that is not a Bundle.
    annotations:
      structure: structured
    slots:
    - resourceType
    slot_usage:
      encodingFormat:
        range: string  # equals_string needs a string range; the fixed value is a valid MediaType
        equals_string: application/fhir+json
      resourceType:
        required: true
        none_of:
        - equals_string: Bundle
        description: The resource type. A Bundle goes in a FhirBundleFile instead.

  FhirNdjsonFile:
    is_a: FhirFile
    description: FHIR Bulk Data NDJSON, one resource type per file.
    annotations:
      structure: structured
    slots:
    - resourceType
    slot_usage:
      encodingFormat:
        range: string  # equals_string needs a string range; the fixed value is a valid MediaType
        equals_string: application/fhir+ndjson
      resourceType:
        required: true

  OmopTableFile:
    is_a: DataFile
    description: One OMOP CDM table.
    annotations:
      structure: structured
    slots:
    - cdmTable
    slot_usage:
      encodingFormat:
        any_of:
        - equals_string: text/csv
        - equals_string: text/tab-separated-values
        - equals_string: application/vnd.apache.parquet
      cdmTable:
        required: true

  CcdaDocumentFile:
    is_a: DataFile
    description: One HL7 C-CDA document.
    annotations:
      structure: structured
    slots:
    - templateIds
    slot_usage:
      encodingFormat:
        any_of:
        - equals_string: application/xml
        - equals_string: text/xml
      subjectIds:
        required: true

  TabularFile:
    is_a: DataFile
    description: A table that is not OMOP or FHIR, such as registry, PRO, claims, mortality or consent data.
    annotations:
      structure: structured
    slots:
    - tableName
    slot_usage:
      encodingFormat:
        any_of:
        - equals_string: text/csv
        - equals_string: text/tab-separated-values
        - equals_string: application/vnd.apache.parquet
        - equals_string: application/json
        - equals_string: application/jsonl
      tableName:
        required: true

  ClinicalDocumentFile:
    is_a: DataFile
    description: An unstructured clinical document, such as a note or a scanned report.
    annotations:
      structure: unstructured
    slot_usage:
      encodingFormat:
        any_of:
        - equals_string: text/plain
        - equals_string: application/pdf
        - equals_string: application/rtf
      subjectIds:
        required: true

  DocumentationFile:
    is_a: DataFile
    description: A file that documents other files, such as a data dictionary or a README.
    annotations:
      structure: mixed
    slots:
    - about
    slot_usage:
      about:
        required: true

  # --- omics ----------------------------------------------------------------

  GenomicsFile:
    is_a: DataFile
    abstract: true
    description: Omics profile base class (Q5).
    slots:
    - assay
    - platform

  SequenceReadsFile:
    is_a: GenomicsFile
    description: Sequencing reads, such as FASTQ.
    annotations:
      structure: structured
    slots:
    - pairedWith

  AlignmentFile:
    is_a: GenomicsFile
    description: Aligned reads, such as BAM or CRAM.
    annotations:
      structure: structured
    slots:
    - referenceGenome
    slot_usage:
      referenceGenome:
        required: true

  VariantFile:
    is_a: GenomicsFile
    description: Variant calls, such as VCF.
    annotations:
      structure: structured
    slots:
    - referenceGenome
    slot_usage:
      referenceGenome:
        required: true

  IndexFile:
    is_a: DataFile
    description: An index of another file, such as .bai, .crai or .tbi.
    annotations:
      structure: structured
    slots:
    - indexOf
    slot_usage:
      indexOf:
        required: true

  # --- images, recordings and other files -----------------------------------

  ImagingFile:
    is_a: DataFile
    description: A medical or photographic image, such as DICOM.
    annotations:
      structure: unstructured

  MediaFile:
    is_a: DataFile
    description: An audio or video recording.
    annotations:
      structure: unstructured

  GenericFile:
    is_a: DataFile
    description: "Any other data file. A curator decides how to process it."
    annotations:
      structure: mixed

# ---------------------------------------------------------------------------
# Slots
# ---------------------------------------------------------------------------
slots:

  modality:
    description: "The kind of data in the file."
    range: ModalityEnum
  recordCount:
    description: Rows, resources or documents in the file, when counted.
    range: integer
    minimum_value: 0
  processingHints:
    description: "Informational key-value pairs for downstream pipelines."
    range: ProcessingHint
    multivalued: true
    inlined_as_list: true
  about:
    slot_uri: sc:about
    range: NodeRef
    multivalued: true
    inlined_as_list: true
    description: The files or record sets this file documents.

  # --- format-specific -------------------------------------------------------
  bundleType:
    description: "The FHIR Bundle.type of the bundles in the file."
    range: FhirBundleTypeEnum
  resourceType:
    description: FHIR resource type of the resources in the file, e.g. Patient.
    range: FhirResourceTypeEnum
  fhirVersion:
    description: >-
      FHIR version of the resources in the file. A file holds resources of one
      version only.
    range: FhirVersionEnum
  implementationGuides:
    description: >-
      FHIR implementation guide packages the resources conform to, as
      "<package id>#<version>", e.g. "hl7.fhir.us.core#6.1.0". A FHIR validator loads
      these packages. Leave it out for resources that follow only the base specification.
    multivalued: true
    pattern: "^[a-z0-9][a-z0-9_-]*(\\.[a-z0-9_-]+)+#[0-9]+\\.[0-9]+\\.[0-9]+(-[A-Za-z0-9.-]+)?$"
  cdmTable:
    description: OMOP CDM table name, e.g. person.
    pattern: "^[a-z][a-z_]*$"
  templateIds:
    description: C-CDA template IDs (root or root:extension).
    multivalued: true
  tableName:
    description: Table name within its dataset.
  assay:
    description: "The assay that produced the data."
  platform:
    description: "The instrument or sequencing platform that produced the data."
  referenceGenome:
    description: Reference assembly, e.g. GRCh38.
  pairedWith:
    description: The mate file of paired-end reads.
    range: NodeRef
    inlined: true
  indexOf:
    description: The file this file indexes.
    range: NodeRef
    inlined: true
