id: https://w3id.org/rddc/data
name: rddc-data
title: RDDC Data File Classes
version: 0.1.0
description: >-
  Data file classes for RDDC: the FileObject subclasses that describe the
  data in a batch, the enums that classify them, and the slots only they use. A file's
  additionalType names one of these classes.


  The module also defines the Croissant file classes the data file classes extend:
  DistributionItem, the base of files and file sets, and FileObject, with the fields
  every file has (contentUrl, contentSize, encodingFormat, md5). It imports only
  core.yaml. The sidecar module (rddc_sidecar.yaml) imports this one and lists data
  files in distribution.


  A concrete class is what one processing pipeline consumes. Where the pipeline
  depends on the format and a media type cannot tell the formats apart (BAM and CRAM,
  EDF and other sensor formats) or the pipelines differ by format (FASTQ and unaligned
  BAM, DICOM and other image formats), the format is the class, and the class maps to
  its EDAM format term. Elsewhere one class covers the formats and encodingFormat and
  compression say which: FHIR JSON and NDJSON, CSV and Parquet, and the variant call
  formats VCF, BCF and MAF, whose classes are decided by what they contain, germline or
  somatic variants.


  Processing rules match a class together with all its subclasses, so a subclass must
  be processable as its parent; what differs between siblings, such as whether they
  identify a person, is in their annotations, which the rules read per concrete class.
  A facial image is not a subclass of ImagingFile for that reason: the header
  de-identification and analysis of medical images do not apply to it.


  Class annotations state facts that hold for every file of the class. They are
  properties of the class, so sidecars do not include them, and processing rules read
  them rather than class names:
    modality: a ModalityEnum value, the kind of data a source registers to deposit.
      The platform checks a file's modality against the source register. Each
      concrete class has exactly one; a new kind of data gets a new class rather than
      a new value on an existing one.
    structure: whether software can read the content without content analysis.
      "structured": records with defined fields (FHIR, OMOP and other tables, C-CDA,
      VCF, FASTQ, BAM); free text inside such a file is declared with
      containsFreeText. "unstructured": content without defined fields (notes,
      scanned documents, images, audio, video), where any identifier can only be
      found by NLP, OCR or image or audio analysis. "mixed": the class admits either
      kind, so the file's content decides (DocumentationFile,
      DifferentialDiagnosisFile, GenericFile).
    fileSetClass: the file set class every file of this class belongs to
      (OmopTableFile in an OmopCdmInstance). The set's conformsTo gives the standard
      and version the files follow, so the files do not repeat it. The RDDC validator
      checks membership.
    rai:dataCollectionType: how the data is always collected, the Croissant
      Responsible AI term with one of its recommended values: "Direct measurement"
      for genomics, imaging and sensor data. A release can copy it into the dataset's
      Croissant metadata.
    biometric: "true" on a class whose content is a biometric identifier under HIPAA
      Safe Harbor (FacialImagingFile). Its files always count as containing biometric
      identifiers, so they cannot set containsBiometricIdentifiers, and they never
      leave INTAKE: they are not loaded into the normalized store or released.
    identifying: "true" on a class whose content can identify a person on its
      own, though it is not a biometric identifier: sequencing reads and alignments
      of any assay, DNA or RNA, and germline variant calls, which DPV classes as
      genetic data (pd:Genetic). RNA-seq and methylation reads carry the germline
      variants of the sequenced regions, so they identify a person as DNA reads do.
      Germline-filtered somatic variant calls and gene expression quantifications are
      not identifying on their own, so their classes leave the annotation out.
      Removing direct identifiers does not make files of an identifying class
      de-identified, whatever the sensitivity flags say. "biometric" implies
      "identifying", so a biometric class does not carry both.
    embedsFiles: "true" on a class whose files can carry other files inside them:
      FHIR files, whose DocumentReference, Media and Binary resources can hold
      documents and images as base64 data, and C-CDA documents, whose body can be a
      non-XML document and whose entries can hold media. Each embedded file can be a
      note, a scan or a face photograph, whatever the outer file's class, so its
      content is not covered by the class's annotations or the sensitivity flags. The
      annotation says what the content can hold, not how to process it: the processing
      rules decide which files are scanned for embedded files.
    containsDates, containsSubStateGeography, containsFreeText, containsBiometricIdentifiers:
      what the class says about a sensitivity flag. "always": every file has it, so a
      file cannot set the flag (a ClinicalDocumentFile has free text). "n/a": the
      format cannot carry it, so the flag is false and a file cannot set it (a FASTQ
      holds no dates). "false": the value when neither the file nor the batch sets
      the flag, replacing the usual unknown. A biometric class counts as
      containsBiometricIdentifiers "always" and does not repeat it. A flag's value
      for a file is, in order: what the class fixes; what the file sets; what the
      batch sets; the class default; else unknown, treated as true.


  These annotations tell the model to treat every file in the class alike. Their
  absence does not mean a file is de-identified. Other classes, including FHIR, may
  contain identifying information and require de-identification checks based on their
  content.
