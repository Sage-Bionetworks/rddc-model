        close_mappings:
        - NCIT:C180883
      ecg:
        title: Electrocardiography
        description: Electrical activity of the heart.
        meaning: NCIT:C38053
        aliases:
        - ECG
        - EKG
      ppg:
        title: Photoplethysmography
        description: >-
          Optical measurement of blood volume changes, the usual source of heart rate on
