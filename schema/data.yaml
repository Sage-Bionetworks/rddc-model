id: https://w3id.org/rddc/data
name: rddc-data
title: RDDC Data File Classes
version: 0.1.0
description: >-
  Data file classes for RDDC: the FileObject subclasses that describe the
  data in a batch, the enums that classify them, and the slots only they use. A file's
  additionalType names one of these classes.


  DataFile extends FileObject from core.yaml, the only module this one imports. The
  sidecar module (rddc_sidecar.yaml) imports this one and lists data files in
  distribution.


  Each concrete class carries a "structure" annotation describing its content. It is a
  property of the class, so sidecars do not include it.
    structured: records with defined fields that software can read without text or
      image analysis (FHIR, OMOP and other tables, C-CDA, VCF, FASTQ, BAM). Free text
      inside such a file is declared with containsFreeText.
    unstructured: content without defined fields (notes, PDF or scanned documents,
      images, audio, video). Using it needs NLP, OCR or image analysis.
    mixed: the class admits either kind, so the file's content decides
      (DocumentationFile, GenericFile).


  Each concrete class also carries a "modality" annotation, a ModalityEnum value naming
  the kind of data it holds. The platform reads it from the class to decide how to
  process the file, so sidecars do not include it either. A new kind of data gets a
  new class rather than a new value on an existing one.


  A class whose data is always collected the same way carries an
  "rai:dataCollectionType" annotation, the Croissant Responsible AI term, with one of
  its recommended values: "Direct measurement" for genomics, imaging and sensor data.
  A release can copy it into the dataset's Croissant metadata.


  A class whose content always identifies a person carries a "biometric" annotation
  set to "true" (FacialImagingFile). Its files count as containing biometric
  identifiers and stay in the trusted research environment, whatever the sensitivity
  flags say.


  A class whose content can identify a person on its own, though it is not a
  biometric identifier under HIPAA Safe Harbor, carries an "identifying" annotation set
  to "true": sequencing reads and alignments of any assay, DNA or RNA, and germline
  variant calls, which DPV classes as genetic data (pd:Genetic). RNA-seq and
  methylation reads carry the germline variants of the sequenced regions, so they
  identify a person as DNA reads do. Germline-filtered somatic variant calls and gene
  expression quantifications are not identifying on their own, so their classes leave
  the annotation out. Removing direct identifiers does not make files of an
  identifying class de-identified, whatever the sensitivity flags say. "biometric"
  implies "identifying", so a biometric class does not carry both: consumers treat a
  biometric class as identifying and, in addition, keep its files in the TRE.
license: https://creativecommons.org/publicdomain/zero/1.0/

prefixes:
  rddc: https://w3id.org/rddc/vocab/
  linkml: https://w3id.org/linkml/
  sc: https://schema.org/
  cr: http://mlcommons.org/croissant/
  dct: http://purl.org/dc/terms/
  prov: http://www.w3.org/ns/prov#
  fhir: http://hl7.org/fhir/
  EDAM: http://edamontology.org/
  OBI: http://purl.obolibrary.org/obo/OBI_
  NCIT: http://purl.obolibrary.org/obo/NCIT_
  SNOMEDCT: http://identifiers.org/snomedct/
  rai: http://mlcommons.org/croissant/RAI/
default_prefix: rddc
default_range: string

imports:
- linkml:types
- core

# ---------------------------------------------------------------------------
# Enumerations
# ---------------------------------------------------------------------------
enums:

  ModalityEnum:
    description: >-
      The kind of data in a file: the values of the "modality" class annotation. Each
      concrete data file class has exactly one, so a sidecar does not state it; the
      platform reads it from the file's class to decide how to process the file. A new
      kind of data gets a new class.
    permissible_values:
      clinical_fhir:
        description: HL7 FHIR resources.
      clinical_omop:
        description: OMOP CDM tables.
      clinical_ccda:
        description: HL7 C-CDA documents.
      clinical_tabular:
        description: Registry, patient-reported, claims or mortality tables not in OMOP or FHIR form (TabularFile).
      clinical_text:
        description: Unstructured clinical text such as notes. De-identified before use.
      consent:
        description: Consent elements for subjects (ConsentFile).
      intake_form:
        description: Responses to patient intake forms, read with the form's definition (IntakeFormFile).
      genomics:
        description: >-
          Sequencing reads, alignments, variant calls, gene expression quantifications
          and related indexes.
      imaging:
        description: Medical images such as DICOM.
      video:
        description: Video recordings (VideoFile).
      audio:
        description: Audio recordings, including voice (AudioFile).
      wearable:
        description: Device or wearable sensor data (SensorSignalFile, SensorMeasureFile).
      metadata:
        description: Files that describe other files, such as data dictionaries or acquisition metadata (DocumentationFile).
      other:
        description: Anything else, routed by curator decision (GenericFile).

  FhirBundleTypeEnum:
    description: FHIR Bundle.type values accepted in a deposit.
    permissible_values:
      collection:
      transaction:
      batch:
      document:
      searchset:
      message:

