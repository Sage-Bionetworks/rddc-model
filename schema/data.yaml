        description: Orphanet rare disease nomenclature, as the Orphanet Rare Disease Ontology.
        aliases:
        - ORDO
        - ORPHA
      omim:
        title: OMIM
        description: Online Mendelian Inheritance in Man phenotype entries.
      mondo:
        title: MONDO
        description: Mondo Disease Ontology.
      other:
        title: Other code system
        description: >-
          A code system not listed here, or uncoded names. Name it in the file's
          description; a curator decides whether it needs its own value.

  OmopCdmTableEnum:
    description: >-
      OMOP CDM tables of every accepted CDM version, the range of cdmTable. The RDDC
      validator checks that the table exists in the CDM version the file's
      OmopCdmInstance declares in conformsTo. The descriptions and groups are in the
      per-version enums, such as OmopCdm54TableEnum. All tables, including vocabulary
      and results tables, may be deposited.
    permissible_values:
      # BEGIN generated by scripts/gen_enums.py omop-all
      person:
      observation_period:
      visit_occurrence:
      visit_detail:
      condition_occurrence:
      drug_exposure:
      procedure_occurrence:
      device_exposure:
      measurement:
      observation:
      death:
      note:
      note_nlp:
      specimen:
      fact_relationship:
      location:
      care_site:
      provider:
      payer_plan_period:
      cost:
      drug_era:
      dose_era:
      condition_era:
      episode:
      episode_event:
      metadata:
      cdm_source:
      concept:
      vocabulary:
      domain:
      concept_class:
      concept_relationship:
      relationship:
      concept_synonym:
      concept_ancestor:
      source_to_concept_map:
      drug_strength:
      cohort:
      cohort_definition:
      # END generated by scripts/gen_enums.py omop-all

  OmopCdm54TableEnum:
    description: >-
      OMOP CDM 5.4 tables, from the OHDSI table list (CommonDataModel v5.4.3,
      inst/csv/OMOP_CDMv5.4_Table_Level.csv). The cdm_schema annotation gives the
      table's group: CDM for clinical and health-system tables, VOCAB for the
      standardized vocabularies, RESULTS for cohort tables.
    permissible_values:
      # BEGIN generated by scripts/gen_enums.py omop-cdm54
      person:
        description: "This table serves as the central identity management for all Persons in the database. It contains records that uniquely identify each person or patient, and some demographic information."
        annotations:
          cdm_schema: CDM
      observation_period:
        description: "This table contains records which define spans of time during which two conditions are expected to hold: (i) Clinical Events that happened to the Person are recorded in the Event tables, and (ii) absence of records indicate such Events did not occur during this span of time."
        annotations:
          cdm_schema: CDM
      visit_occurrence:
        description: "This table contains Events where Persons engage with the healthcare system for a duration of time. They are often also called \"Encounters\". Visits are defined by a configuration of circumstances under which they occur, such as (i) whether the patient comes to a healthcare institution, the other way around, or the interaction is remote, (ii) whether and what kind of trained medical staff is delivering the service during the Visit, and (iii) whether the Visit is transient or for a longer period involving a stay in bed."
        annotations:
          cdm_schema: CDM
      visit_detail:
        description: "The VISIT_DETAIL table is an optional table used to represents details of each record in the parent VISIT_OCCURRENCE table. Examples include the movement between units in a hospital during an inpatient stay or claim lines associated with a one insurance claim. For every record in the VISIT_OCCURRENCE table there may be 0 or more records in the VISIT_DETAIL table with a 1:n relationship where n may be 0. The VISIT_DETAIL table is structurally very similar to VISIT_OCCURRENCE table and belongs to the visit domain."
        annotations:
          cdm_schema: CDM
      condition_occurrence:
        description: "This table contains records of Events of a Person suggesting the presence of a disease or medical condition stated as a diagnosis, a sign, or a symptom, which is either observed by a Provider or reported by the patient."
        annotations:
          cdm_schema: CDM
      drug_exposure:
        description: "This table captures records about the exposure to a Drug ingested or otherwise introduced into the body. A Drug is a biochemical substance formulated in such a way that when administered to a Person it will exert a certain biochemical effect on the metabolism. Drugs include prescription and over-the-counter medicines, vaccines, and large-molecule biologic therapies. Radiological devices ingested or applied locally do not count as Drugs."
        annotations:
          cdm_schema: CDM
      procedure_occurrence:
        description: "This table contains records of activities or processes ordered by, or carried out by, a healthcare provider on the patient with a diagnostic or therapeutic purpose."
        annotations:
          cdm_schema: CDM
      device_exposure:
        description: "The Device domain captures information about a person's exposure to a foreign physical object or instrument which is used for diagnostic or therapeutic purposes through a mechanism beyond chemical action. Devices include implantable objects (e.g. pacemakers, stents, artificial joints), medical equipment and supplies (e.g. bandages, crutches, syringes), other instruments used in medical procedures (e.g. sutures, defibrillators) and material used in clinical care (e.g. adhesives, body material, dental material, surgical material)."
        annotations:
          cdm_schema: CDM
      measurement:
        description: "The MEASUREMENT table contains records of Measurements, i.e. structured values (numerical or categorical) obtained through systematic and standardized examination or testing of a Person or Person's sample. The MEASUREMENT table contains both orders and results of such Measurements as laboratory tests, vital signs, quantitative findings from pathology reports, etc. Measurements are stored as attribute value pairs, with the attribute as the Measurement Concept and the value representing the result. The value can be a Concept (stored in VALUE_AS_CONCEPT), or a numerical value (VALUE_AS_NUMBER) with a Unit (UNIT_CONCEPT_ID). The Procedure for obtaining the sample is housed in the PROCEDURE_OCCURRENCE table, though it is unnecessary to create a PROCEDURE_OCCURRENCE record for each measurement if one does not exist in the source data. Measurements differ from Observations in that they require a standardized test or some other activity to generate a quantitative or qualitative result. If there is no result, it is assumed that the lab test was conducted but the result was not captured."
        annotations:
          cdm_schema: CDM
      observation:
        description: "The OBSERVATION table captures clinical facts about a Person obtained in the context of examination, questioning or a procedure. Any data that cannot be represented by any other domains, such as social and lifestyle facts, medical history, family history, etc. are recorded here."
        annotations:
          cdm_schema: CDM
      death:
        description: "The death domain contains the clinical event for how and when a Person dies. A person can have up to one record if the source system contains evidence about the Death, such as: Condition in an administrative claim, status of enrollment into a health plan, or explicit record in EHR data."
        annotations:
          cdm_schema: CDM
      note:
        description: "The NOTE table captures unstructured information that was recorded by a provider about a patient in free text (in ASCII, or preferably in UTF8 format) notes on a given date. The type of note_text is CLOB or varchar(MAX) depending on RDBMS."
        annotations:
          cdm_schema: CDM
      note_nlp:
        description: "The NOTE_NLP table encodes all output of NLP on clinical notes. Each row represents a single extracted term from a note."
        annotations:
          cdm_schema: CDM
      specimen:
        description: "The specimen domain contains the records identifying biological samples from a person."
        annotations:
          cdm_schema: CDM
      fact_relationship:
        description: "The FACT_RELATIONSHIP table contains records about the relationships between facts stored as records in any table of the CDM. Relationships can be defined between facts from the same domain, or different domains. Examples of Fact Relationships include: [Person relationships](https://athena.ohdsi.org/search-terms/terms?domain=Relationship&standardConcept=Standard&page=2&pageSize=15&query=) (parent-child), care site relationships (hierarchical organizational structure of facilities within a health system), indication relationship (between drug exposures and associated conditions), usage relationships (of devices during the course of an associated procedure), or facts derived from one another (measurements derived from an associated specimen)."
        annotations:
          cdm_schema: CDM
      location:
        description: "The LOCATION table stores physical location or address information of Persons and Care Sites."
        annotations:
          cdm_schema: CDM
      care_site:
        description: "The CARE_SITE table contains a list of uniquely identified institutional (physical or organizational) units where healthcare delivery is practiced (offices, wards, hospitals, clinics, etc.)."
        annotations:
          cdm_schema: CDM
      provider:
        description: "The PROVIDER table contains a list of uniquely identified healthcare providers; duplication is not allowed. These are individuals providing hands-on healthcare to patients, such as physicians, nurses, midwives, physical therapists etc."
        annotations:
          cdm_schema: CDM
      payer_plan_period:
        description: "The PAYER_PLAN_PERIOD table captures details of the period of time that a Person is continuously enrolled under a specific health Plan benefit structure from a given Payer. Each Person receiving healthcare is typically covered by a health benefit plan, which pays for (fully or partially), or directly provides, the care. These benefit plans are provided by payers, such as health insurances or state or government agencies. In each plan the details of the health benefits are defined for the Person or her family, and the health benefit Plan might change over time typically with increasing utilization (reaching certain cost thresholds such as deductibles), plan availability and purchasing choices of the Person. The unique combinations of Payer organizations, health benefit Plans and time periods in which they are valid for a Person are recorded in this table."
        annotations:
          cdm_schema: CDM
      cost:
        description: "The COST table captures records containing the cost of any medical event recorded in one of the OMOP clinical event tables such as DRUG_EXPOSURE, PROCEDURE_OCCURRENCE, VISIT_OCCURRENCE, VISIT_DETAIL, DEVICE_OCCURRENCE, OBSERVATION or MEASUREMENT. Each record in the cost table account for the amount of money transacted for the clinical event. So, the COST table may be used to represent both receivables (charges) and payments (paid), each transaction type represented by its COST_CONCEPT_ID. The COST_TYPE_CONCEPT_ID field will use concepts in the Standardized Vocabularies to designate the source (provenance) of the cost data. A reference to the health plan information in the PAYER_PLAN_PERIOD table is stored in the record for information used for the adjudication system to determine the persons benefit for the clinical event."
        annotations:
          cdm_schema: CDM
      drug_era:
        description: "A Drug Era is a period when the Person is assumed to be exposed to a particular active ingredient. A Drug Era is not the same as a Drug Exposure: Exposures are individual records corresponding to the source when Drug was delivered to the Person, while successive periods of Drug Exposures are combined under certain rules to produce continuous Drug Eras. Every record in the DRUG_EXPOSURE table should be part of a drug era based on the dates of exposure."
        annotations:
          cdm_schema: CDM
      dose_era:
        description: "A Dose Era is a period when the Person is assumed to be exposed to a constant dose of a specific active ingredient."
        annotations:
          cdm_schema: CDM
      condition_era:
        description: "A Condition Era is a period when the Person is assumed to have a given condition. Similar to Drug Eras, Condition Eras are chronological periods of Condition Occurrence and every Condition Occurrence record should be part of a Condition Era. Combining individual Condition Occurrences into a single Condition Era serves two purposes: - It allows aggregation of chronic conditions that require frequent ongoing care, instead of treating each Condition Occurrence as an independent event. - It allows aggregation of multiple, closely timed doctor visits for the same Condition to avoid double-counting the Condition Occurrences. For example, consider a Person who visits her Primary Care Physician (PCP) and who is referred to a specialist. At a later time, the Person visits the specialist, who confirms the PCP's original diagnosis and provides the appropriate treatment to resolve the condition. These two independent doctor visits should be aggregated into one Condition Era."
        annotations:
          cdm_schema: CDM
      episode:
        description: "The EPISODE table aggregates lower-level clinical events (VISIT_OCCURRENCE, DRUG_EXPOSURE, PROCEDURE_OCCURRENCE, DEVICE_EXPOSURE) into a higher-level abstraction representing clinically and analytically relevant disease phases,outcomes and treatments. The EPISODE_EVENT table connects qualifying clinical events (VISIT_OCCURRENCE, DRUG_EXPOSURE, PROCEDURE_OCCURRENCE, DEVICE_EXPOSURE) to the appropriate EPISODE entry. For example cancers including their development over time, their treatment, and final resolution."
        annotations:
          cdm_schema: CDM
      episode_event:
        description: "The EPISODE_EVENT table connects qualifying clinical events (such as CONDITION_OCCURRENCE, DRUG_EXPOSURE, PROCEDURE_OCCURRENCE, MEASUREMENT) to the appropriate EPISODE entry. For example, linking the precise location of the metastasis (cancer modifier in MEASUREMENT) to the disease episode."
        annotations:
          cdm_schema: CDM
      metadata:
        description: "The METADATA table contains metadata about a dataset that has been transformed to the OMOP Common Data Model."
        annotations:
          cdm_schema: CDM
      cdm_source:
        description: "The CDM_SOURCE table contains detail about the source database and the process used to transform the data into the OMOP Common Data Model."
        annotations:
          cdm_schema: CDM
      concept:
        description: "The Standardized Vocabularies contains records, or Concepts, that uniquely identify each fundamental unit of meaning used to express clinical information in all domain tables of the CDM. Concepts are derived from vocabularies, which represent clinical information across a domain (e.g. conditions, drugs, procedures) through the use of codes and associated descriptions. Some Concepts are designated Standard Concepts, meaning these Concepts can be used as normative expressions of a clinical entity within the OMOP Common Data Model and standardized analytics. Each Standard Concept belongs to one Domain, which defines the location where the Concept would be expected to occur within the data tables of the CDM. Concepts can represent broad categories ('Cardiovascular disease'), detailed clinical elements ('Myocardial infarction of the anterolateral wall'), or modifying characteristics and attributes that define Concepts at various levels of detail (severity of a disease, associated morphology, etc.). Records in the Standardized Vocabularies tables are derived from national or international vocabularies such as SNOMED-CT, RxNorm, and LOINC, or custom OMOP Concepts defined to cover various aspects of observational data analysis."
        annotations:
          cdm_schema: VOCAB
      vocabulary:
        description: "The VOCABULARY table includes a list of the Vocabularies integrated from various sources or created de novo in OMOP CDM. This reference table contains a single record for each Vocabulary and includes a descriptive name and other associated attributes for the Vocabulary."
        annotations:
          cdm_schema: VOCAB
      domain:
        description: "The DOMAIN table includes a list of OMOP-defined Domains to which the Concepts of the Standardized Vocabularies can belong. A Domain represents a clinical definition whereby we assign matching Concepts for the standardized fields in the CDM tables. For example, the Condition Domain contains Concepts that describe a patient condition, and these Concepts can only be used in the condition_concept_id field of the CONDITION_OCCURRENCE and CONDITION_ERA tables. This reference table is populated with a single record for each Domain, including a Domain ID and a descriptive name for every Domain."
        annotations:
          cdm_schema: VOCAB
      concept_class:
        description: "The CONCEPT_CLASS table includes semantic categories that reference the source structure of each Vocabulary. Concept Classes represent so-called horizontal (e.g. MedDRA, RxNorm) or vertical levels (e.g. SNOMED) of the vocabulary structure. Vocabularies without any Concept Classes, such as HCPCS, use the vocabulary_id as the Concept Class. This reference table is populated with a single record for each Concept Class, which includes a Concept Class ID and a fully specified Concept Class name."
        annotations:
          cdm_schema: VOCAB
      concept_relationship:
        description: "The CONCEPT_RELATIONSHIP table contains records that define relationships between any two Concepts and the nature or type of the relationship. This table captures various types of relationships, including hierarchical, associative, and other semantic connections, enabling comprehensive analysis and interpretation of clinical concepts. Every kind of relationship is defined in the RELATIONSHIP table."
        annotations:
          cdm_schema: VOCAB
      relationship:
        description: "The RELATIONSHIP table provides a reference list of all types of relationships that can be used to associate any two Concepts in the CONCEPT_RELATIONSHIP table, the respective reverse relationships, and their hierarchical characteristics. Note, that Concepts representing relationships between the clinical facts, used for filling in the FACT_RELATIONSHIP table are stored in the CONCEPT table and belong to the Relationship Domain."
        annotations:
          cdm_schema: VOCAB
      concept_synonym:
        description: "The CONCEPT_SYNONYM table captures alternative terms, synonyms, and translations of Concept Name into various languages linked to specific concepts."
        annotations:
          cdm_schema: VOCAB
      concept_ancestor:
        description: "The CONCEPT_ANCESTOR table is designed to simplify observational analysis by providing the complete hierarchical relationships between Concepts. Only direct parent-child relationships between Concepts are stored in the CONCEPT_RELATIONSHIP table. To determine higher-level ancestry connections, all individual direct relationships would have to be navigated at analysis time. The CONCEPT_ANCESTOR table includes records for all parent-child relationships, as well as grandparent-grandchild relationships and those of any other level of lineage for Standard or Classification concepts. Using the CONCEPT_ANCESTOR table allows for querying for all descendants of a hierarchical concept, and the other way around. For example, drug ingredients and drug products, beneath them in the hierarchy, are all descendants of a drug class ancestor. This table is entirely derived from the CONCEPT, CONCEPT_RELATIONSHIP, and RELATIONSHIP tables."
        annotations:
          cdm_schema: VOCAB
      source_to_concept_map:
        description: "The source to concept map table is recommended for use in ETL processes to maintain local source codes which are not available as Concepts in the Standardized Vocabularies, and to establish mappings for each source code into a Standard Concept as target_concept_ids that can be used to populate the Common Data Model tables. The SOURCE_TO_CONCEPT_MAP table is no longer populated with content within the Standardized Vocabularies published to the OMOP community. **There are OHDSI tools to help you populate this table; [Usagi](https://github.com/OHDSI/Usagi) and [Perseus](https://github.com/ohdsi/Perseus). You can read more about OMOP vocabulary mapping in [The Book of OHDSI Chapter 6.3](https://ohdsi.github.io/TheBookOfOhdsi/ExtractTransformLoad.html#step-2-create-the-code-mappings).**"
        annotations:
          cdm_schema: VOCAB
      drug_strength:
        description: "The DRUG_STRENGTH table contains structured content about the amount or concentration and associated units of a specific ingredient contained within a particular drug product. This table is supplemental information to support standardized analysis of drug utilization."
        annotations:
          cdm_schema: VOCAB
      cohort:
        description: "The subject of a cohort can have multiple, discrete records in the cohort table per cohort_definition_id, subject_id, and non-overlapping time periods. The definition of the cohort is contained within the COHORT_DEFINITION table. It is listed as part of the RESULTS schema because it is a table that users of the database as well as tools such as ATLAS need to be able to write to. The CDM and Vocabulary tables are all read-only so it is suggested that the COHORT and COHORT_DEFINTION tables are kept in a separate schema to alleviate confusion."
        annotations:
          cdm_schema: RESULTS
      cohort_definition:
        description: "The COHORT_DEFINITION table contains records defining a Cohort derived from the data through the associated description and syntax and upon instantiation (execution of the algorithm) placed into the COHORT table. Cohorts are a set of subjects that satisfy a given combination of inclusion criteria for a duration of time. The COHORT_DEFINITION table provides a standardized structure for maintaining the rules governing the inclusion of a subject into a cohort, and can store operational programming code to instantiate the cohort within the OMOP Common Data Model."
        annotations:
          cdm_schema: RESULTS
      # END generated by scripts/gen_enums.py omop-cdm54

# ---------------------------------------------------------------------------
# Classes
# ---------------------------------------------------------------------------
classes:

  # --- distribution items ---------------------------------------------------

  DistributionItem:
    abstract: true
    description: >-
      A FileObject or FileSet in distribution. Its additionalType names the RDDC class
      and determines the required fields.
    slots:
    - id
    - type
    - additionalType
    - name
    - description
    - encodingFormat
    - valueOrigins
    - additionalProperty
    slot_usage:
      id:
        required: true
      type:
        required: true
      additionalType:
        required: true
      name:
        required: true

  FileObject:
    is_a: DistributionItem
    abstract: true
    class_uri: cr:FileObject
    description: One object under the batch prefix.
    slots:
    - contentUrl
    - contentSize
    - sha256
    - md5
    - compression
    slot_usage:
      id:
        range: UuidUrn
        description: >-
          The file ID, urn:uuid:<file_id>. Keep it when moving or re-registering the
          file. Changed content gets a new ID. IDs must be unique within the sidecar.
      type:
        equals_string: cr:FileObject
      name:
        description: File name, by convention the contentUrl.
      contentUrl:
        required: true
      contentSize:
        required: true
      encodingFormat:
        required: true
      md5:
        required: true

  # --- data files ------------------------------------------------------------

  DataFile:
    is_a: FileObject
    abstract: true
    description: >-
      A data object of the batch, with subjects, sensitivity and provenance. Its class
      determines its modality and how it is processed (see the class annotations).
    slots:
    - subjectIds
    - recordCount
    - identifier
    - sensitivity
    - processingHints
    - wasDerivedFrom
    slot_usage:
      wasDerivedFrom:
        description: "References to input files in this sidecar, such as the alignment used to call variants."

  ProcessingHint:
    class_uri: sc:PropertyValue
    description: >-
      An informational key-value pair for a pipeline. Any value used to make a pipeline
      decision must be a defined schema field.
    slots:
    - type
    - propertyID
    - value
    slot_usage:
      type:
        equals_string: sc:PropertyValue
      propertyID:
        required: true
        pattern: "^[a-z][a-z0-9_]*:[A-Za-z][A-Za-z0-9_.]*$"
        description: 'Namespaced key, "<namespace>:<key>", e.g. "fhir_to_omop:source_vocabulary".'
      value:
        required: true

  # --- per-file sensitivity for classes that fix a flag ----------------------
  # FileSensitivity (core.yaml) has every flag. A class that fixes a flag ("always"
  # or "n/a") uses a variant without it, so a file cannot contradict its class.

  BiometricFileSensitivity:
    description: >-
      Per-file sensitivity overrides for a biometric class (FacialImagingFile). It has
      no containsBiometricIdentifiers flag: the class already says every file contains
      biometric identifiers.
    slots:
    - containsDates
    - containsSubStateGeography
    - containsFreeText
    - notes

  DocumentFileSensitivity:
    description: >-
      Per-file sensitivity overrides for an unstructured document class
      (ClinicalDocumentFile). It has no containsFreeText flag: the class already says
      every file is free text.
    slots:
    - containsDates
    - containsSubStateGeography
    - containsBiometricIdentifiers
    - notes

  FixedSensitivity:
    description: >-
      Per-file sensitivity for a class whose format can carry none of the flagged
      content (the genomics classes and IndexFile). Notes only.
    slots:
    - notes

  # --- clinical -------------------------------------------------------------

  FhirFile:
    is_a: DataFile
    broad_mappings:
    - EDAM:data_3861
    abstract: true
    description: >-
      Base class for FHIR JSON files. The FHIR version and the implementation guides the
      resources follow, such as US Core, are declared once in the conformsTo of the file
      set the file belongs to (its fileSetClass), not per file.

  FhirBundleFile:
    is_a: FhirFile
    description: One FHIR Bundle JSON document, in a FhirBundleCollection.
    annotations:
      structure: structured
      modality: clinical_fhir
      fileSetClass: FhirBundleCollection
      embedsFiles: "true"
    slots:
    - bundleType
    slot_usage:
      encodingFormat:
        range: string  # equals_string needs a string range; the fixed value is a valid MediaType
        equals_string: application/fhir+json
      bundleType:
        required: true
      subjectIds:
        required: true

  FhirSingleTypeFile:
    is_a: FhirFile
    abstract: true
    description: >-
      Base class for FHIR files that hold one resource type.
    slots:
    - resourceType
    slot_usage:
      resourceType:
        required: true

  FhirResourceFile:
    is_a: FhirSingleTypeFile
    description: One FHIR resource JSON document that is not a Bundle, in a FhirResourceCollection.
    annotations:
      structure: structured
      modality: clinical_fhir
      fileSetClass: FhirResourceCollection
      embedsFiles: "true"
    slot_usage:
      encodingFormat:
        range: string  # equals_string needs a string range; the fixed value is a valid MediaType
        equals_string: application/fhir+json
      resourceType:
        none_of:
        - equals_string: Bundle
        description: The resource type. A Bundle goes in a FhirBundleFile instead.

  FhirNdjsonFile:
    is_a: FhirSingleTypeFile
    description: FHIR Bulk Data NDJSON, one resource type per file, in a FhirBulkExport.
    annotations:
      structure: structured
      modality: clinical_fhir
      fileSetClass: FhirBulkExport
      embedsFiles: "true"
    slot_usage:
      encodingFormat:
        range: string  # equals_string needs a string range; the fixed value is a valid MediaType
        equals_string: application/fhir+ndjson

  OmopTableFile:
    is_a: DataFile
    broad_mappings:
    - EDAM:data_3861
    description: >-
      One OMOP CDM table, in an OmopCdmInstance. The instance's conformsTo gives the
      CDM version, and the RDDC validator checks that cdmTable exists in that version.
      CDM tables have no column for images or recordings, so a file contains no
      biometric identifiers unless it says so.
    annotations:
      structure: structured
      modality: clinical_omop
      fileSetClass: OmopCdmInstance
      containsBiometricIdentifiers: "false"
    slots:
    - cdmTable
    slot_usage:
      encodingFormat:
        any_of:
        - equals_string: text/csv
        - equals_string: text/tab-separated-values
        - equals_string: application/vnd.apache.parquet
      cdmTable:
        required: true

  CcdaDocumentFile:
    is_a: DataFile
    broad_mappings:
    - EDAM:data_3861
    description: >-
      One HL7 C-CDA document, in a CcdaDocumentSet. Its template IDs are in the document
      header and its C-CDA release is in the conformsTo of the set, so neither is
      repeated per file.
    annotations:
      structure: structured
      modality: clinical_ccda
      fileSetClass: CcdaDocumentSet
      embedsFiles: "true"
    slot_usage:
      encodingFormat:
        any_of:
        - equals_string: application/xml
        - equals_string: text/xml
      subjectIds:
        required: true

  TabularFile:
    is_a: DataFile
    broad_mappings:
    - EDAM:data_3861
    description: >-
      A clinical table that is not OMOP or FHIR, such as registry, patient-reported
      outcome, claims or mortality data. Consent tables go in a ConsentFile, intake form
      responses in an IntakeFormFile, sensor data in a SensorMeasureFile, and tables
      that describe other files in a DocumentationFile.
      Its name and contentUrl identify the table; record sets describe its columns and
      joins to other tables.
    annotations:
      structure: structured
      modality: clinical_tabular
    slot_usage:
      encodingFormat:
        any_of:
        - equals_string: text/csv
        - equals_string: text/tab-separated-values
        - equals_string: application/vnd.apache.parquet
        - equals_string: application/json
        - equals_string: application/jsonlines

  ConsentFile:
    is_a: DataFile
    description: >-
      Permitted data uses for each listed subject. The platform applies them to access
      decisions rather than processing them as clinical data. A consent elements table
      holds coded uses and dates, so sub-state geography, free text and biometric identifiers
      are absent unless the file says otherwise.
    annotations:
      structure: structured
      modality: consent
      containsSubStateGeography: "false"
      containsFreeText: "false"
      containsBiometricIdentifiers: "false"
    slot_usage:
      encodingFormat:
        any_of:
        - equals_string: text/csv
        - equals_string: text/tab-separated-values
        - equals_string: application/json
        - equals_string: application/jsonlines
      subjectIds:
        required: true

  IntakeFormFile:
    is_a: DataFile
    close_mappings:
    - fhir:QuestionnaireResponse
    description: >-
      Responses to a patient intake form, exported as a table, such as from REDCap or a
      clinic portal: one row per completed form, or one per answer. Its columns are the
      form's questions and its values are coded answers, so it is read with the form's
      definition, named in formDefinition, rather than as a generic table. Intake forms
      in FHIR form, QuestionnaireResponse resources, go in a FHIR file, and scanned
      paper forms in a ClinicalDocumentFile. Free-text answers make the file contain
      free text (containsFreeText). A table of coded answers holds no biometric
      identifiers unless the file says so.
    annotations:
      structure: structured
      modality: intake_form
      containsBiometricIdentifiers: "false"
    slots:
    - formDefinition
    - formVersion
    slot_usage:
      encodingFormat:
        any_of:
        - equals_string: text/csv
        - equals_string: text/tab-separated-values
        - equals_string: application/vnd.apache.parquet
        - equals_string: application/json
        - equals_string: application/jsonlines
      formDefinition:
        required: true
      subjectIds:
        required: true

  GeneticTestResultFile:
    is_a: DataFile
    close_mappings:
    - fhir:DiagnosticReport
    description: >-
      Results of clinical genetic tests or molecular pathology, exported as records: for
      each test, its name, method, date and status, and its findings, such as genes,
      variants in HGVS notation, zygosity and classification (for example ACMG/AMP), with
      the laboratory's interpretation as text. The interpretation makes the file
      contain free text (containsFreeText). Report documents (PDFs) go in
      ClinicalDocumentFiles that reportDocuments points to; sequencing data and variant
      calls go in the genomics classes. A report lists few variants, not a genome, so
      the class is not identifying, although a rare variant can single a person out
      within a small cohort. Results records hold no address or image, so sub-state geography
      and biometric identifiers are absent unless the file says otherwise.
    annotations:
      structure: structured
      modality: genetic_testing
      containsSubStateGeography: "false"
      containsBiometricIdentifiers: "false"
    slots:
    - referenceGenome
    - reportDocuments
    slot_usage:
      encodingFormat:
        any_of:
        - equals_string: text/csv
        - equals_string: text/tab-separated-values
        - equals_string: application/vnd.apache.parquet
        - equals_string: application/json
        - equals_string: application/jsonlines
        - equals_string: application/xml
        - equals_string: text/xml
      referenceGenome:
        description: >-
          Reference assembly of the genomic coordinates in the results, when they have
          any. Variants given only in transcript HGVS notation need none.
      subjectIds:
        required: true

  DifferentialDiagnosisFile:
    is_a: DataFile
    close_mappings:
    - fhir:RiskAssessment
    description: >-
      Candidate diagnoses ranked by a diagnosis support tool, such as a facial
      phenotyping or phenotype-matching tool, or by another method: for each subject, the top candidates with
      their rank, score and code. The candidates are suggestions, not diagnoses, so they
      are kept apart from confirmed conditions; in FHIR they are Conditions with
      verificationStatus "differential". A tool's export is structured; a report in PDF
      is unstructured and needs text extraction. wasDerivedFrom points to the files in
      the sidecar the tool analysed, such as facial images. Candidates hold no address
      or image, so sub-state geography and biometric identifiers are absent unless the file
      says otherwise.
    annotations:
      structure: mixed
      modality: diagnosis_support
      containsSubStateGeography: "false"
      containsBiometricIdentifiers: "false"
    slots:
    - software
    - softwareVersion
    - diagnosisCodeSystems
    slot_usage:
      encodingFormat:
        any_of:
        - equals_string: text/csv
        - equals_string: text/tab-separated-values
        - equals_string: application/json
        - equals_string: application/jsonlines
        - equals_string: application/pdf
      subjectIds:
        required: true

  ClinicalDocumentFile:
    is_a: DataFile
    broad_mappings:
    - EDAM:data_3861
    description: >-
      An unstructured clinical document, such as a note, a scanned report or a genetic
      test report. A scan is a PDF or an image (TIFF, JPEG or PNG). The whole document
      is free text, so every file counts as containing free text and cannot set
      containsFreeText.
    annotations:
      structure: unstructured
      modality: clinical_text
      containsFreeText: always
    slots:
    - documentType
    slot_usage:
      encodingFormat:
        any_of:
        - equals_string: text/plain
        - equals_string: application/pdf
        - equals_string: application/rtf
        - equals_string: image/tiff
        - equals_string: image/jpeg
        - equals_string: image/png
      subjectIds:
        required: true
      sensitivity:
        range: DocumentFileSensitivity
        description: >-
          Per-file sensitivity overrides. containsFreeText is left out: the class
          already says the file is free text.

  DocumentationFile:
    is_a: DataFile
    broad_mappings:
    - EDAM:data_2337
    description: >-
      A file that documents other files, such as a data dictionary, the codebook of an
      intake form, or a README. When it documents particular files or record sets,
      about points to them; a README for the whole batch leaves about out.
      Documentation describes the data and holds no
      subject-level content, so every flag is false unless the file says otherwise.
    annotations:
      structure: mixed
      modality: metadata
      containsDates: "false"
      containsSubStateGeography: "false"
      containsFreeText: "false"
      containsBiometricIdentifiers: "false"
    slots:
    - about

  # --- omics ----------------------------------------------------------------
  # The format is the class: FASTQ, BAM, CRAM, VCF and BCF have no registered media
  # type, and the pipelines differ by format.

  GenomicsFile:
    is_a: DataFile
    abstract: true
    description: >-
      Base class for genomic sequencing data. For reads and alignments the class names
      the format and maps to its EDAM format term; for variant calls the media type and
      compression do. encodingFormat names only the container for formats with no
      registered media type: text/plain for text formats (FASTQ, VCF) and
      application/octet-stream for binary ones (BAM, CRAM, BCF). A gzip or
      BGZF-compressed text file (.fastq.gz, .vcf.gz) says so in compression. BAM, CRAM
      and BCF compress internally as part of the format, so they leave compression
      unset. The formats hold sequence data, run metadata and expression values, not
      subject-level dates, addresses, narrative or biometric identifiers, so the
      sensitivity flags do not apply: what identifies the person, where the class
      says so, is the sequence itself (the identifying annotation).
    slots:
    - measurementTechnique
    - sequencingPlatform
    - platform
    slot_usage:
      measurementTechnique:
        required: true
        range: GenomicsAssayEnum
        description: >-
          The sequencing assay that produced the data, e.g. wgs or wes. Downstream
          analysis depends on it, so every genomics file states it.
      sequencingPlatform:
        required: true
      platform:
        description: The sequencing instrument model, e.g. "Illumina NovaSeq X".
      sensitivity:
        range: FixedSensitivity
        description: Notes only. The class fixes every sensitivity flag.

  SequenceReadsFile:
    is_a: GenomicsFile
    close_mappings:
    - EDAM:data_2977
    abstract: true
    description: >-
      Base class for sequencing reads before alignment: a FastqFile or an
      UnalignedBamFile. Paired-end files reference each other through pairedWith.
    annotations:
      identifying: "true"
    slots:
    - pairedWith

  FastqFile:
    is_a: SequenceReadsFile
    close_mappings:
    - EDAM:format_1930
    description: >-
      Sequencing reads in FASTQ, usually gzip or BGZF-compressed (.fastq.gz).
    annotations:
      structure: structured
      modality: genomics
      rai:dataCollectionType: Direct measurement
      identifying: "true"
      containsDates: n/a
      containsSubStateGeography: n/a
      containsFreeText: n/a
      containsBiometricIdentifiers: n/a
    slot_usage:
      encodingFormat:
        range: string  # equals_string needs a string range; the fixed value is a valid MediaType
        equals_string: text/plain
      compression:
        any_of:
        - equals_string: gzip
        - equals_string: bgzf

  UnalignedBamFile:
    is_a: SequenceReadsFile
    close_mappings:
    - EDAM:format_2572
    description: >-
      Sequencing reads in an unaligned BAM (uBAM), such as the output of a PacBio or
      Oxford Nanopore basecaller.
    annotations:
      structure: structured
      modality: genomics
      rai:dataCollectionType: Direct measurement
      identifying: "true"
      containsDates: n/a
      containsSubStateGeography: n/a
      containsFreeText: n/a
      containsBiometricIdentifiers: n/a
    slot_usage:
      encodingFormat:
        range: string  # equals_string needs a string range; the fixed value is a valid MediaType
        equals_string: application/octet-stream

  AlignmentFile:
    is_a: GenomicsFile
    close_mappings:
    - EDAM:data_1383
    abstract: true
    description: >-
      Base class for aligned reads: a BamFile or a CramFile. SAM, the text form, is
      not accepted; convert it to BAM.
    annotations:
      identifying: "true"
    slots:
    - referenceGenome
    slot_usage:
      referenceGenome:
        required: true

  BamFile:
    is_a: AlignmentFile
    close_mappings:
    - EDAM:format_2572
    description: Aligned reads in BAM. Its index (.bai) is an IndexFile.
    annotations:
      structure: structured
      modality: genomics
      rai:dataCollectionType: Direct measurement
      identifying: "true"
      containsDates: n/a
      containsSubStateGeography: n/a
      containsFreeText: n/a
      containsBiometricIdentifiers: n/a
    slot_usage:
      encodingFormat:
        range: string  # equals_string needs a string range; the fixed value is a valid MediaType
        equals_string: application/octet-stream

  CramFile:
    is_a: AlignmentFile
    close_mappings:
    - EDAM:format_3462
    description: >-
      Aligned reads in CRAM, which needs the assembly named in referenceGenome to be
      read. Its index (.crai) is an IndexFile.
    annotations:
      structure: structured
      modality: genomics
      rai:dataCollectionType: Direct measurement
      identifying: "true"
      containsDates: n/a
      containsSubStateGeography: n/a
      containsFreeText: n/a
      containsBiometricIdentifiers: n/a
    slot_usage:
      encodingFormat:
        range: string  # equals_string needs a string range; the fixed value is a valid MediaType
        equals_string: application/octet-stream

  VariantFile:
    is_a: GenomicsFile
    close_mappings:
    - EDAM:data_3498
    abstract: true
    description: >-
      Base class for variant calls. Germline variants identify a person and somatic
      variants alone do not, so a file goes in GermlineVariantFile or
      SomaticVariantFile depending on which it can contain. The format is told by the
      media type and compression, not the class: a VCF is text/plain and, when it has a
      tabix or CSI index (an IndexFile), BGZF-compressed (compression bgzf; a plain
      gzipped VCF sets gzip); a BCF is application/octet-stream; a MAF, a tab-separated
      table, is text/tab-separated-values.
    slots:
    - referenceGenome
    slot_usage:
      referenceGenome:
        required: true
      encodingFormat:
        any_of:
        - equals_string: text/plain
        - equals_string: application/octet-stream
        - equals_string: text/tab-separated-values
        description: text/plain for VCF, application/octet-stream for BCF, text/tab-separated-values for MAF.
      compression:
        any_of:
        - equals_string: gzip
        - equals_string: bgzf

  GermlineVariantFile:
    is_a: VariantFile
    description: >-
      Variant calls that contain or may contain germline variants: germline calls, joint
      genotypes, and somatic calls that still include germline variants, such as
      unfiltered tumor-only calls. Germline variants identify a person.
    annotations:
      structure: structured
      modality: genomics
      rai:dataCollectionType: Direct measurement
      identifying: "true"
      containsDates: n/a
      containsSubStateGeography: n/a
      containsFreeText: n/a
      containsBiometricIdentifiers: n/a

  SomaticVariantFile:
    is_a: VariantFile
    description: >-
      Somatic variant calls from tumor or other somatic tissue with germline variants
      removed, typically by calling against a matched normal sample and filtering
      against population variant databases, as in the GDC's masked somatic mutation
      files. Calls that may still include germline variants go in a GermlineVariantFile.
    annotations:
      structure: structured
      modality: genomics
      rai:dataCollectionType: Direct measurement
      containsDates: n/a
      containsSubStateGeography: n/a
      containsFreeText: n/a
      containsBiometricIdentifiers: n/a

  GeneExpressionFile:
    is_a: GenomicsFile
    broad_mappings:
    - EDAM:data_2603
    close_mappings:
    - EDAM:data_3917
    description: >-
      Gene or transcript expression quantified from RNA-seq, such as a matrix of counts
      or TPM per gene and sample. It holds no sequence, so it is not identifying the way
      the reads and alignments it came from are. Expression values can still be linked
      to a person's genotype through expression quantitative trait loci (eQTLs), so
      the file is still personal data.
    annotations:
      structure: structured
      modality: genomics
      rai:dataCollectionType: Direct measurement
      containsDates: n/a
      containsSubStateGeography: n/a
      containsFreeText: n/a
      containsBiometricIdentifiers: n/a
    slot_usage:
      measurementTechnique:
        any_of:
        - equals_string: rna_seq
        - equals_string: other
        description: The assay the expression was quantified from, rna_seq or other.
      encodingFormat:
        any_of:
        - equals_string: text/csv
        - equals_string: text/tab-separated-values
        - equals_string: application/vnd.apache.parquet
        - equals_string: application/octet-stream
        description: >-
          Media type of the matrix. Formats with no registered media type, such as
          AnnData (.h5ad), are application/octet-stream.

  IndexFile:
    is_a: DataFile
    broad_mappings:
    - EDAM:data_0955
    description: >-
      An index of another file in the sidecar. The index format follows the indexed
      file: .bai for a BamFile, .crai for a CramFile, .tbi or .csi for a VCF and .csi
      for a BCF (a variant file). Indexes are binary, so encodingFormat is
      application/octet-stream, and they hold offsets, not content, so the sensitivity
      flags do not apply.
    annotations:
      structure: structured
      modality: genomics
      containsDates: n/a
      containsSubStateGeography: n/a
      containsFreeText: n/a
      containsBiometricIdentifiers: n/a
    slots:
    - indexOf
    slot_usage:
      encodingFormat:
        range: string  # equals_string needs a string range; the fixed value is a valid MediaType
        equals_string: application/octet-stream
      indexOf:
        required: true
      sensitivity:
        range: FixedSensitivity
        description: Notes only. The class fixes every sensitivity flag.

  # --- images, recordings and other files -----------------------------------

  ImagingFile:
    is_a: DataFile
    close_mappings:
    - EDAM:data_3424
    abstract: true
    description: >-
      Base class for medical and clinical images other than facial images: a
      DicomImageFile or, for other formats, an ImageFile. A photograph or 3D model of a
      person's face goes in a FacialImagingFile, which is not a subclass of this one:
      rules for images must not apply to it.
    slots:
    - measurementTechnique
    slot_usage:
      measurementTechnique:
        required: true
        range: ImagingAssayEnum
        description: >-
          The imaging technique that produced the image, e.g. ct, mri or photography.
          Analysis depends on it, so every image states it.

  DicomImageFile:
    is_a: ImagingFile
    close_mappings:
    - EDAM:format_3548
    description: >-
      A DICOM image or series, such as a CT or MRI. DICOM headers carry study dates,
      patient details and comments, and images can carry burned-in text, so the
      sensitivity flags apply as the batch declares them.
    annotations:
      structure: unstructured
      modality: imaging
      rai:dataCollectionType: Direct measurement
    slot_usage:
      encodingFormat:
        range: string  # equals_string needs a string range; the fixed value is a valid MediaType
        equals_string: application/dicom

  ImageFile:
    is_a: ImagingFile
    close_mappings:
    - EDAM:format_3591
    - EDAM:format_3727
    - EDAM:format_3603
    - EDAM:format_3579
    - EDAM:format_4001
    description: >-
      An image in a format other than DICOM: TIFF or OME-TIFF, PNG, JPEG, JPEG 2000, or
      a whole-slide, microscopy or NIfTI volume format with no registered media type
      (application/octet-stream). These formats have no field for an address, so a
      file contains no sub-state geography unless it says so; burned-in text counts as free
      text.
    annotations:
      structure: unstructured
      modality: imaging
      rai:dataCollectionType: Direct measurement
      containsSubStateGeography: "false"
    slot_usage:
      encodingFormat:
        any_of:
        - equals_string: image/tiff
        - equals_string: image/png
        - equals_string: image/jpeg
        - equals_string: image/jp2
        - equals_string: application/octet-stream
        description: >-
          Media type of the image. Whole-slide (SVS, NDPI, CZI) and NIfTI files have no
          registered media type, so they are application/octet-stream.

  FacialImagingFile:
    is_a: DataFile
    broad_mappings:
    - EDAM:data_3424
    description: >-
      An image or 3D surface model of a person's face, such as those taken for
      dysmorphology assessment or facial phenotyping. measurementTechnique says how it
      was captured: a photograph, a 3D surface scan, or a CT or MRI. A face is a
      biometric identifier, so the file always counts as containing biometric
      identifiers. Not a subclass of ImagingFile: facial images are processed by their
      own tools and never leave INTAKE.
    annotations:
      structure: unstructured
      modality: imaging
      rai:dataCollectionType: Direct measurement
      biometric: "true"
    slots:
    - measurementTechnique
    slot_usage:
      measurementTechnique:
        required: true
        range: ImagingAssayEnum
        any_of:
        - equals_string: photography
        - equals_string: surface_scan_3d
        - equals_string: ct
        - equals_string: mri
        - equals_string: other
        description: >-
          How the face was captured. Processing differs: 2D photographs and 3D surface
          models go to different facial analysis tools.
      sensitivity:
        range: BiometricFileSensitivity
        description: >-
          Per-file sensitivity overrides. containsBiometricIdentifiers is left out: the
          class already says the file contains biometric identifiers.
      encodingFormat:
        any_of:
        - equals_string: image/jpeg
        - equals_string: image/png
        - equals_string: image/tiff
        - equals_string: image/heic
        - equals_string: application/dicom
        - equals_string: model/obj
        - equals_string: model/stl
        - equals_string: model/gltf-binary
        - equals_string: model/gltf+json
        - equals_string: model/mtl
        - equals_string: application/octet-stream
        description: >-
          Media type of the image or 3D model. An OBJ model's material file is model/mtl.
          PLY has no registered media type, so a PLY model is application/octet-stream.
      subjectIds:
        required: true

  AudioFile:
    is_a: DataFile
    description: >-
      An audio recording. A recording of a person's voice contains biometric
      identifiers, so set sensitivity.containsBiometricIdentifiers to true. Audio
      formats have no field for an address, so a file contains no sub-state geography unless
      it says so; speech counts as free text.
    annotations:
      structure: unstructured
      modality: audio
      containsSubStateGeography: "false"
    slot_usage:
      encodingFormat:
        pattern: "^audio/[A-Za-z0-9.+_-]+$"
        description: An audio media type, such as audio/wav or audio/mpeg.

  VideoFile:
    is_a: DataFile
    description: >-
      A video recording. A recording containing a person's face or voice contains
      biometric identifiers, so set sensitivity.containsBiometricIdentifiers to true.
      Video formats have no field for an address, so a file contains no sub-state geography
      unless it says so; speech and on-screen text count as free text.
    annotations:
      structure: unstructured
      modality: video
      containsSubStateGeography: "false"
    slot_usage:
      encodingFormat:
        pattern: "^video/[A-Za-z0-9.+_-]+$"
        description: A video media type, such as video/mp4.

  # --- sensor data ----------------------------------------------------------
  # A raw signal's format is its class, since the readers differ by format.

  SensorDataFile:
    is_a: DataFile
    abstract: true
    description: >-
      Base class for data recorded by a wearable or other sensor device. A raw signal
      goes in one of the SensorSignalFile classes and measures derived from it in a
      SensorMeasureFile, since they need different processing. Sensor data already in
      FHIR form, such as device Observations, goes in a FHIR file instead. Sensor data
      carries timestamps, which count as dates; it is not a biometric identifier under
      HIPAA Safe Harbor, and its formats have no field for an address.
    slots:
    - measurementTechnique
    - platform
    slot_usage:
      measurementTechnique:
        required: true
        multivalued: true
        minimum_cardinality: 1
        range: SensorAssayEnum
        description: >-
          The sensing techniques that produced the data, e.g. accelerometry or ecg. A list,
          since one recording or summary can combine several, such as a sleep study's EEG
          and ECG channels.
      platform:
        description: The device that recorded the data, e.g. "ActiGraph GT9X".

  SensorSignalFile:
    is_a: SensorDataFile
    abstract: true
    description: >-
      Base class for a raw sensor signal, such as 100 Hz accelerometry or an ECG
      waveform, before any aggregation. The class names the format: EdfSignalFile,
      WfdbSignalFile, DicomWaveformFile or, for a device maker's own format,
      VendorSignalFile.
    slots:
    - samplingRate

  EdfSignalFile:
    is_a: SensorSignalFile
    description: >-
      A signal in EDF or EDF+ (European Data Format), the usual format for
      polysomnography and EEG. Its header has fields for the patient's identification
      and the recording start date, and EDF+ annotation channels hold free text, so
      those flags apply as the batch declares them. EDF has no registered media type,
      so it is application/octet-stream.
    annotations:
      structure: structured
      modality: sensor
      rai:dataCollectionType: Direct measurement
      containsSubStateGeography: "false"
      containsBiometricIdentifiers: "false"
    slot_usage:
      encodingFormat:
        range: string  # equals_string needs a string range; the fixed value is a valid MediaType
        equals_string: application/octet-stream

  WfdbSignalFile:
    is_a: SensorSignalFile
    description: >-
      One file of a WFDB (PhysioNet WaveForm DataBase) record: the header (.hea,
      text/plain) or a signal file (.dat, application/octet-stream). The files of one
      record are kept together in a file set, and the header names the signal files.
      Header comments can hold free text.
    annotations:
      structure: structured
      modality: sensor
      rai:dataCollectionType: Direct measurement
      containsSubStateGeography: "false"
      containsBiometricIdentifiers: "false"
    slot_usage:
      encodingFormat:
        any_of:
        - equals_string: text/plain
        - equals_string: application/octet-stream

  DicomWaveformFile:
    is_a: SensorSignalFile
    close_mappings:
    - EDAM:format_3548
    description: >-
      A DICOM waveform object, such as a 12-lead ECG. Its headers carry the same
      patient details as a DICOM image, including an address, so every flag except
      biometric identifiers applies as the batch declares it.
    annotations:
      structure: structured
      modality: sensor
      rai:dataCollectionType: Direct measurement
      containsBiometricIdentifiers: "false"
    slot_usage:
      encodingFormat:
        range: string  # equals_string needs a string range; the fixed value is a valid MediaType
        equals_string: application/dicom

  VendorSignalFile:
    is_a: SensorSignalFile
    description: >-
      A signal in a device maker's own format, such as ActiGraph .gt3x or Garmin FIT.
      platform, the device, is required, since it decides how the file is read. Such
      formats have no registered media type, so the file is application/octet-stream.
    annotations:
      structure: structured
      modality: sensor
      rai:dataCollectionType: Direct measurement
      containsSubStateGeography: "false"
      containsBiometricIdentifiers: "false"
    slot_usage:
      platform:
        required: true
      encodingFormat:
        range: string  # equals_string needs a string range; the fixed value is a valid MediaType
        equals_string: application/octet-stream

  SensorMeasureFile:
    is_a: SensorDataFile
    description: >-
      Measures derived from sensor data, such as per-minute step counts, sleep stages or
      daily heart rate summaries, as a table or JSON. IEEE 1752.1 (Open mHealth) defines
      JSON schemas for sleep and physical activity measures. Measures are structured
      values with timestamps, so a file contains no free text unless it says so.
    annotations:
      structure: structured
      modality: sensor
      rai:dataCollectionType: Direct measurement
      containsSubStateGeography: "false"
      containsFreeText: "false"
      containsBiometricIdentifiers: "false"
    slot_usage:
      encodingFormat:
        any_of:
        - equals_string: text/csv
        - equals_string: text/tab-separated-values
        - equals_string: application/vnd.apache.parquet
        - equals_string: application/json
        - equals_string: application/jsonlines

  GenericFile:
    is_a: DataFile
    description: >-
      Any other data file. GenericFile is strongly discouraged. A dedicated data
      class is required; using GenericFile triggers lengthy manual review.
    annotations:
      structure: mixed
      modality: other

# ---------------------------------------------------------------------------
# Slots
# ---------------------------------------------------------------------------
slots:

  # --- all files (FileObject) ----------------------------------------------
  contentUrl:
    slot_uri: sc:contentUrl
    range: RelativePath
    description: Object key relative to the batch prefix; Croissant resolves it against the sidecar's location.
  contentSize:
    description: "Size of the file in bytes."
    slot_uri: sc:contentSize
    range: ByteSize
  encodingFormat:
    slot_uri: sc:encodingFormat
    range: MediaType
    description: Media type of the content (after decompression when compression is set).
  sha256:
    description: "Optional SHA-256 checksum of the file, as lowercase hexadecimal."
    slot_uri: sc:sha256
    pattern: "^[0-9a-f]{64}$"
  md5:
    slot_uri: cr:md5
    pattern: "^[0-9a-f]{32}$"
    description: >-
      MD5 checksum of the file, as lowercase hexadecimal. Lets the platform check
      for corruption in transfer against Synapse file handles and single-part S3 ETags.
  compression:
    description: "Compression applied to the file's bytes, if any."
    range: CompressionEnum

  # --- all data files (DataFile) --------------------------------------------
  subjectIds:
    description: Subject IDs the file contains. Each must appear in the subject table.
    range: Identifier
    multivalued: true
    minimum_cardinality: 1
  recordCount:
    description: Rows, resources or documents in the file, when counted.
    range: integer
    minimum_value: 0
  processingHints:
    description: "Informational key-value pairs for downstream pipelines."
    range: ProcessingHint
    multivalued: true
    inlined_as_list: true

  # --- FHIR (FhirFile and its subclasses) -----------------------------------
  # resourceType: single-type files (FhirResourceFile, FhirNdjsonFile).
  resourceType:
    description: FHIR resource type of the resources in the file, e.g. Patient.
    range: FhirResourceTypeEnum
  # bundleType: FhirBundleFile.
  bundleType:
    description: "The FHIR Bundle.type of the bundle in the file."
    range: FhirBundleTypeEnum

  # --- OMOP (OmopTableFile) -------------------------------------------------
  cdmTable:
    description: >-
      OMOP CDM table in the file, e.g. person. It must exist in the CDM version the
      file's OmopCdmInstance declares in conformsTo.
    range: OmopCdmTableEnum

  # --- intake forms (IntakeFormFile) ----------------------------------------
  formDefinition:
    range: NodeRef
    inlined: true
    description: >-
      The definition of the form the responses answer: its questions, answer codes and
      skip logic. Either the @id of a DocumentationFile in this sidecar that holds it,
      such as a REDCap data dictionary, or the canonical URL or CURIE of a published
      definition, such as a FHIR Questionnaire or a LOINC panel.
  formVersion:
    description: >-
      The version of the form the responses answer, as the form's owner numbers it.
      Answer codes can change between versions.

  # --- clinical documents (ClinicalDocumentFile) ----------------------------
  documentType:
    range: DocumentTypeEnum
    description: >-
      The kind of document, e.g. progress_note or referral_note, when the source
      records it. Text processing and the OMOP note class depend on it. A file holds
      documents of one kind; documents of several kinds go in separate files, or leave
      documentType out.

  # --- genetic test results (GeneticTestResultFile) --------------------------
  reportDocuments:
    range: NodeRef
    multivalued: true
    inlined_as_list: true
    minimum_cardinality: 1
    description: >-
      The report documents of the results, ClinicalDocumentFiles in this sidecar, such
      as the laboratory's signed PDF reports.

  # --- diagnosis support (DifferentialDiagnosisFile) -------------------------
  software:
    description: >-
      The tool that produced the candidates, e.g. "Face2Gene" or "Exomiser", when they
      come from a known tool. The ranking depends on the tool.
  softwareVersion:
    slot_uri: sc:softwareVersion
    description: The version of the tool, or of its model, that produced the candidates.
  diagnosisCodeSystems:
    range: DiagnosisCodeSystemEnum
    multivalued: true
    minimum_cardinality: 1
    description: >-
      The code systems the candidate diagnoses are coded in, e.g. orphanet and omim,
      when they are coded. A list, since tools often give several codes per candidate.

  # --- documentation (DocumentationFile) ------------------------------------
  about:
    slot_uri: sc:about
    range: NodeRef
    multivalued: true
    inlined_as_list: true
    minimum_cardinality: 1
    description: The files or record sets this file documents.

  # --- assays and instruments -----------------------------------------------
  # measurementTechnique: GenomicsFile, ImagingFile, FacialImagingFile,
  # SensorDataFile and their subclasses.
  measurementTechnique:
    slot_uri: sc:measurementTechnique
    description: >-
      The assay or technique that produced the data, schema.org's measurementTechnique.
      Each class that uses it sets the allowed values, from an enum whose values map to
      ontology terms.
  # sequencingPlatform: GenomicsFile and its subclasses.
  sequencingPlatform:
    range: SequencingPlatformEnum
    description: >-
      The sequencing technology that produced the data, e.g. illumina or
      oxford_nanopore. It tells short reads from long reads, which need different
      processing.
  # platform: GenomicsFile, SensorDataFile and their subclasses.
  platform:
    description: "The instrument, sequencing platform or device that produced the data."

  # --- sensor data (SensorSignalFile and its subclasses) ---------------------
  samplingRate:
    slot_uri: cr:samplingRate
    description: >-
      Samples per second of the recorded signal, in hertz. When channels differ, the
      highest rate. Croissant's term, which Croissant sets on audio fields.
    range: float
    minimum_value: 0

  # --- genomics (GenomicsFile and its subclasses, IndexFile) ----------------
  # referenceGenome: aligned or called data (AlignmentFile, VariantFile).
  referenceGenome:
    description: Reference assembly the coordinates refer to, e.g. GRCh38.
    range: ReferenceGenomeEnum
  # pairedWith: SequenceReadsFile.
  pairedWith:
    description: The mate file of paired-end reads.
    range: NodeRef
    inlined: true
  # indexOf: IndexFile.
  indexOf:
    description: The file this file indexes.
    range: NodeRef
    inlined: true
