id: https://w3id.org/rddc/core
name: rddc-core
title: RDDC Core
version: 0.1.0
description: >-
  Shared building blocks of the RDDC schema modules: identifier types, small supporting
  classes such as references, identifiers, extensions, sensitivity flags and value
  origins, and the slots they use. The file classes (DistributionItem, FileObject) are
  in data.yaml. The data module (data.yaml) and the sidecar module (rddc_sidecar.yaml)
  import this one. It does not import either of them.
license: https://creativecommons.org/publicdomain/zero/1.0/

prefixes:
  rddc: https://w3id.org/rddc/vocab/
  linkml: https://w3id.org/linkml/
  sc: https://schema.org/
  cr: http://mlcommons.org/croissant/
  dct: http://purl.org/dc/terms/
  prov: http://www.w3.org/ns/prov#
  pd: https://w3id.org/dpv/pd#
default_prefix: rddc
default_range: string

imports:
- linkml:types

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
types:
  UuidUrn:
    uri: xsd:anyURI
    typeof: uriorcurie
    description: "A UUID in the form urn:uuid:<uuid>, using lowercase hexadecimal."
    pattern: "^urn:uuid:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
  Identifier:
    uri: xsd:string
    typeof: string
    description: "A coded identifier. Letters, digits, and the characters . _ - : only."
    pattern: "^[A-Za-z0-9._:-]+$"

# ---------------------------------------------------------------------------
# Enumerations
# ---------------------------------------------------------------------------
enums:

  ValueOriginEnum:
    description: Source of an auto-filled value.
    permissible_values:
      declared:
        description: Supplied by the contributor or an operator.
      detected:
        description: "Read from the file content or headers by a repeatable check."
      inferred:
        description: "Suggested by a heuristic. A person must confirm it before validation passes."

# ---------------------------------------------------------------------------
# Classes
# ---------------------------------------------------------------------------
classes:

  NodeRef:
    description: >-
      A reference to another object in the form {"@id": ...}. Use a file's UUID URN, or
      the local ID of a file set, record set or field.
    slots:
    - id
    slot_usage:
      id:
        required: true
        identifier: false
        range: uriorcurie

  FileSensitivity:
    description: >-
      Per-file overrides for the header contains* flags. A file can set these to true or
      false, unless its class fixes the flag (see the class annotations in data.yaml):
      such classes use a variant of this class without that flag. Only the batch can
      set directIdentifiersRemoved and synthetic.
    slots:
    - containsDates
    - containsSubStateGeography
    - containsFreeText
    - containsBiometricIdentifiers
    - notes

  ExternalIdentifier:
    class_uri: sc:PropertyValue
    description: >-
      An ID assigned to a file by another system, represented as a schema.org
      PropertyValue. Submitted sidecars include only contributor-supplied IDs.
    slots:
    - type
    - propertyID
    - value
    slot_usage:
      type:
        equals_string: sc:PropertyValue
      propertyID:
        required: true
      value:
        required: true

  Extension:
    class_uri: sc:PropertyValue
    description: >-
      A project-specific key-value pair with a namespace, stored in additionalProperty.
      Unknown properties elsewhere fail validation. Tools that rewrite sidecars preserve
      extensions.
    slots:
    - type
    - propertyID
    - value
    slot_usage:
      type:
        equals_string: sc:PropertyValue
      propertyID:
        required: true
        pattern: "^ext:[a-z][a-z0-9_]*:[A-Za-z][A-Za-z0-9_.]*$"
        description: 'Form "ext:<namespace>:<key>", e.g. "ext:ta2_fdna:cohort".'
      value:
        required: true

  ValueOrigin:
    description: "How a tool populated a file, file-set or sidecar value."
    slots:
    - fieldPath
    - origin
    - method
    - confidence
    - confirmed
    slot_usage:
      fieldPath:
        required: true
      origin:
        required: true

# ---------------------------------------------------------------------------
# Slots
# ---------------------------------------------------------------------------
slots:

  # --- JSON-LD keywords -------------------------------------------------------
  id:
    description: "JSON-LD node identifier (@id). Unique within the sidecar."
    alias: "@id"
    identifier: true
    range: uriorcurie
  type:
    alias: "@type"
    description: The JSON-LD type. cr:FileObject or cr:FileSet for distribution items.
    # A CURIE, but the range is string: classes pin it with equals_string, which
    # LinkML's loader (gen-jsonld, gen-yaml) accepts only on a string range.
    range: string
  additionalType:
    slot_uri: sc:additionalType
    designates_type: true
    range: uriorcurie
    description: >-
      The RDDC class of a distribution item, as a CURIE such as
      rddc:FhirNdjsonFile. Selects the required fields.

  # --- schema.org / Croissant terms -------------------------------------------
  name:
    description: "Human-readable name."
    slot_uri: sc:name
  description:
    description: "Free-text description."
    slot_uri: sc:description
  identifier:
    description: "IDs assigned to the file by other systems."
    slot_uri: sc:identifier
    range: ExternalIdentifier
    multivalued: true
    inlined_as_list: true
  additionalProperty:
    description: "Namespaced extension key-value pairs."
    slot_uri: sc:additionalProperty
    range: Extension
    multivalued: true
    inlined_as_list: true
  propertyID:
    description: "The key of a key-value pair, or the system that assigned an identifier."
    slot_uri: sc:propertyID
  value:
    description: "The value of a key-value pair or identifier."
    slot_uri: sc:value

  # --- PROV-O -----------------------------------------------------------------
  wasDerivedFrom:
    description: "Items in this sidecar that this item was derived from, by @id."
    slot_uri: prov:wasDerivedFrom
    range: NodeRef
    multivalued: true
    inlined_as_list: true

  # --- RDDC: sensitivity -----------------------------------------------------
  sensitivity:
    description: "Sensitivity information for the batch or file. File-level contains* flags override the batch values."
    range: FileSensitivity
    inlined: true
  containsDates:
    description: >-
      The data includes dates more precise than a year. These are accepted at deposit
      and masked at release. HIPAA Safe Harbor identifier (C), 45 CFR
      164.514(b)(2)(i)(C), which also covers ages over 89.
    range: boolean
    narrow_mappings:
    - pd:BirthDate
  containsSubStateGeography:
    description: >-
      The data includes geographic subdivisions smaller than a state, such as street
      addresses, cities, counties, precincts, ZIP codes and their geocodes. These are
      accepted at deposit and masked at release. HIPAA Safe Harbor identifier (B), 45
      CFR 164.514(b)(2)(i)(B).
    range: boolean
    narrow_mappings:
    - pd:PostalCode
  containsFreeText:
    description: >-
      The data includes unstructured text that needs a de-identification scan. Not a
      HIPAA Safe Harbor identifier itself: free text can contain any of them.
    range: boolean
  containsBiometricIdentifiers:
    description: >-
      The data includes biometric identifiers, full-face images, voice or similar
      content. Such files never leave INTAKE: they are not loaded into the normalized
      store or released. HIPAA Safe Harbor identifiers (P), biometric identifiers
      including finger and voice prints, and (Q), full-face photographs and comparable
      images, 45 CFR 164.514(b)(2)(i).
    range: boolean
    close_mappings:
    - pd:Biometric
    related_mappings:
    - pd:Picture
  notes:
    description: "Free-text notes on the sensitivity values."

  # --- RDDC: value origins ---------------------------------------------------
  valueOrigins:
    description: "How tools populated this node's values."
    range: ValueOrigin
    multivalued: true
    inlined_as_list: true
  fieldPath:
    description: JSON pointer to the value within the node.
  origin:
    description: "Where the value came from."
    range: ValueOriginEnum
  method:
    description: Detector or rule that produced the value.
  confidence:
    description: "Confidence in a detected or inferred value, from 0 to 1."
    range: float
    minimum_value: 0
    maximum_value: 1
  confirmed:
    description: "A person confirmed the value. Must be true for inferred values before validation passes."
    range: boolean
