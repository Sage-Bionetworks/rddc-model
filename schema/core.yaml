id: https://w3id.org/rddc/core
name: rddc-core
title: RDDC Core
version: 0.1.0
description: >-
  Shared building blocks of the RDDC schema modules: types, the Croissant file classes
  (DistributionItem and FileObject), small supporting classes such as references,
  identifiers, extensions and value origins, and the slots they use. The data module
  (data.yaml) and the sidecar module (rddc_sidecar.yaml) import it. It does not import
  either of them.
license: https://creativecommons.org/publicdomain/zero/1.0/

prefixes:
  rddc: https://w3id.org/rddc/vocab/
  linkml: https://w3id.org/linkml/
  sc: https://schema.org/
  cr: http://mlcommons.org/croissant/
  dct: http://purl.org/dc/terms/
  prov: http://www.w3.org/ns/prov#
  pd: https://w3id.org/dpv/pd#
default_prefix: rddc
default_range: string

imports:
- linkml:types

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
types:
  UuidUrn:
    uri: xsd:anyURI
    typeof: uriorcurie
    description: "A UUID in the form urn:uuid:<uuid>, using lowercase hexadecimal."
    pattern: "^urn:uuid:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
  RelativePath:
    uri: xsd:string
    typeof: string
    description: >-
      An object key relative to the batch prefix. Segments are separated by single
      forward slashes, with no leading or trailing slash, no backslashes and no '.' or
      '..' segments.
    pattern: "^(?!(.*/)?\\.\\.?(/|$))[^/\\\\]+(/[^/\\\\]+)*$"
  Identifier:
    uri: xsd:string
    typeof: string
    description: "A coded identifier. Letters, digits, and the characters . _ - : only."
    pattern: "^[A-Za-z0-9._:-]+$"
  MediaType:
    uri: xsd:string
    typeof: string
    description: An IANA media type, without parameters.
    pattern: "^[a-z]+/[A-Za-z0-9.+_-]+$"
  ByteSize:
    uri: xsd:string
    typeof: string
    description: A Croissant contentSize in bytes, written "<integer> B".
    pattern: "^[0-9]+ B$"

# ---------------------------------------------------------------------------
# Enumerations
# ---------------------------------------------------------------------------
enums:

  CompressionEnum:
    description: >-
      Compression applied to the file's bytes. encodingFormat names the media
      type of the content after decompression. Croissant has no compression
      property; generic Croissant tools ignore this term.
    permissible_values:
      gzip:
        description: gzip (RFC 1952).
      bgzf:
        description: >-
          Blocked GNU Zip Format, the gzip-compatible block compression of htslib. A
          BGZF file reads as gzip, but only BGZF can carry a tabix or CSI index, so a
          .vcf.gz written by bgzip declares bgzf and one written by gzip declares gzip.
      bzip2:
      xz:
      zstd:

  ValueOriginEnum:
    description: Source of an auto-filled value.
    permissible_values:
      declared:
        description: Supplied by the contributor or an operator.
      detected:
        description: "Read from the file content or headers by a repeatable check."
      inferred:
        description: "Suggested by a heuristic. A person must confirm it before validation passes."

# ---------------------------------------------------------------------------
# Classes
# ---------------------------------------------------------------------------
classes:

  NodeRef:
    description: >-
      A reference to another object in the form {"@id": ...}. Use a file's UUID URN, or
      the local ID of a file set, record set or field.
    slots:
    - id
    slot_usage:
      id:
        required: true
        identifier: false
        range: uriorcurie

  FileSensitivity:
    description: >-
      Per-file overrides for the header contains* flags. A file can set these to true or
      false, unless its class fixes the flag (see the class annotations in data.yaml):
      such classes use a variant of this class without that flag. Only the batch can
      set directIdentifiersRemoved and synthetic.
    slots:
    - containsDates
    - containsZipCodes
    - containsFreeText
    - containsBiometricIdentifiers
    - notes

  ExternalIdentifier:
    class_uri: sc:PropertyValue
    description: >-
      An ID assigned to a file by another system, represented as a schema.org
      PropertyValue. Submitted sidecars include only contributor-supplied IDs.
    slots:
    - type
    - propertyID
    - value
    slot_usage:
      type:
        equals_string: sc:PropertyValue
      propertyID:
        required: true
      value:
        required: true

  Extension:
    class_uri: sc:PropertyValue
    description: >-
      A project-specific key-value pair with a namespace, stored in additionalProperty.
      Unknown properties elsewhere fail validation. Tools that rewrite sidecars preserve
      extensions.
    slots:
    - type
    - propertyID
    - value
    slot_usage:
      type:
        equals_string: sc:PropertyValue
      propertyID:
        required: true
        pattern: "^ext:[a-z][a-z0-9_]*:[A-Za-z][A-Za-z0-9_.]*$"
        description: 'Form "ext:<namespace>:<key>", e.g. "ext:ta2_fdna:cohort".'
      value:
        required: true

  ValueOrigin:
    description: "How a tool populated a file, file-set or sidecar value."
    slots:
    - fieldPath
    - origin
    - method
    - confidence
    - confirmed
    slot_usage:
      fieldPath:
        required: true
      origin:
        required: true

  # --- distribution items ---------------------------------------------------

  DistributionItem:
    abstract: true
    description: >-
      A FileObject or FileSet in distribution. Its additionalType names the RDDC class
      and determines the required fields.
    slots:
    - id
    - type
    - additionalType
    - name
    - description
    - encodingFormat
    - valueOrigins
    - additionalProperty
    slot_usage:
      id:
        required: true
      type:
        required: true
      additionalType:
        required: true
      name:
        required: true

  FileObject:
    is_a: DistributionItem
    abstract: true
    class_uri: cr:FileObject
    description: One object under the batch prefix.
    slots:
    - contentUrl
    - contentSize
    - sha256
    - md5
    - compression
    slot_usage:
      id:
        range: UuidUrn
        description: >-
          The file ID, urn:uuid:<file_id>. Keep it when moving or re-registering the
          file. Changed content gets a new ID. IDs must be unique within the sidecar.
      type:
        equals_string: cr:FileObject
      name:
        description: File name, by convention the contentUrl.
      contentUrl:
        required: true
      contentSize:
        required: true
      encodingFormat:
        required: true
      sha256:
        required: true
      md5:
        required: true

# ---------------------------------------------------------------------------
# Slots
# ---------------------------------------------------------------------------
slots:

  # --- JSON-LD keywords -------------------------------------------------------
  id:
    description: "JSON-LD node identifier (@id). Unique within the sidecar."
    alias: "@id"
    identifier: true
    range: uriorcurie
  type:
    alias: "@type"
    description: The JSON-LD type. cr:FileObject or cr:FileSet for distribution items.
    # A CURIE, but the range is string: classes pin it with equals_string, which
    # LinkML's loader (gen-jsonld, gen-yaml) accepts only on a string range.
    range: string
  additionalType:
    slot_uri: sc:additionalType
    designates_type: true
    range: uriorcurie
    description: >-
      The RDDC class of a distribution item, as a CURIE such as
      rddc:FhirNdjsonFile. Selects the required fields.

  # --- schema.org / Croissant terms -------------------------------------------
  name:
    description: "Human-readable name."
    slot_uri: sc:name
  description:
    description: "Free-text description."
    slot_uri: sc:description
  contentUrl:
    slot_uri: sc:contentUrl
    range: RelativePath
    description: Object key relative to the batch prefix; Croissant resolves it against the sidecar's location.
  contentSize:
    description: "Size of the file in bytes."
    slot_uri: sc:contentSize
    range: ByteSize
  encodingFormat:
    slot_uri: sc:encodingFormat
    range: MediaType
    description: Media type of the content (after decompression when compression is set).
  sha256:
    description: "SHA-256 checksum of the file, as lowercase hexadecimal."
    slot_uri: sc:sha256
    pattern: "^[0-9a-f]{64}$"
  md5:
    slot_uri: cr:md5
    pattern: "^[0-9a-f]{32}$"
    description: >-
      MD5 checksum of the file, as lowercase hexadecimal. Lets the platform check
      for corruption in transfer against Synapse file handles and single-part S3 ETags.
  identifier:
    description: "IDs assigned to the file by other systems."
    slot_uri: sc:identifier
    range: ExternalIdentifier
    multivalued: true
    inlined_as_list: true
  additionalProperty:
    description: "Namespaced extension key-value pairs."
    slot_uri: sc:additionalProperty
    range: Extension
    multivalued: true
    inlined_as_list: true
  propertyID:
    description: "The key of a key-value pair, or the system that assigned an identifier."
    slot_uri: sc:propertyID
  value:
    description: "The value of a key-value pair or identifier."
    slot_uri: sc:value

  # --- PROV-O -----------------------------------------------------------------
  wasDerivedFrom:
    description: "Items in this sidecar that this item was derived from, by @id."
    slot_uri: prov:wasDerivedFrom
    range: NodeRef
    multivalued: true
    inlined_as_list: true

  # --- RDDC: sensitivity -----------------------------------------------------
  sensitivity:
    description: "Sensitivity information for the batch or file. File-level contains* flags override the batch values."
    range: FileSensitivity
    inlined: true
  containsDates:
    description: >-
      The data includes dates more precise than a year. These are accepted at deposit
      and masked at release. HIPAA Safe Harbor identifier (C), 45 CFR
      164.514(b)(2)(i)(C), which also covers ages over 89.
    range: boolean
    narrow_mappings:
    - pd:BirthDate
  containsZipCodes:
    description: >-
      The data includes postal codes. These are accepted at deposit and masked at
      release. Part of HIPAA Safe Harbor identifier (B), 45 CFR 164.514(b)(2)(i)(B),
      which covers all geographic subdivisions smaller than a state; this flag covers
      postal codes only.
    range: boolean
    exact_mappings:
    - pd:PostalCode
  containsFreeText:
    description: >-
      The data includes unstructured text that needs a de-identification scan. Not a
      HIPAA Safe Harbor identifier itself: free text can contain any of them.
    range: boolean
  containsBiometricIdentifiers:
    description: >-
      The data includes biometric identifiers, full-face images, voice or similar
      content. Such files never leave INTAKE: they are not loaded into the normalized
      store or released. HIPAA Safe Harbor identifiers (P), biometric identifiers
      including finger and voice prints, and (Q), full-face photographs and comparable
      images, 45 CFR 164.514(b)(2)(i).
    range: boolean
    close_mappings:
    - pd:Biometric
    related_mappings:
    - pd:Picture
  notes:
    description: "Free-text notes on the sensitivity values."

  # --- RDDC: files -----------------------------------------------------------
  subjectIds:
    description: Subject IDs the file contains. Each must appear in the subject table.
    range: Identifier
    multivalued: true
    minimum_cardinality: 1
  compression:
    description: "Compression applied to the file's bytes, if any."
    range: CompressionEnum

  # --- RDDC: value origins ---------------------------------------------------
  valueOrigins:
    description: "How tools populated this node's values."
    range: ValueOrigin
    multivalued: true
    inlined_as_list: true
  fieldPath:
    description: JSON pointer to the value within the node.
  origin:
    description: "Where the value came from."
    range: ValueOriginEnum
  method:
    description: Detector or rule that produced the value.
  confidence:
    description: "Confidence in a detected or inferred value, from 0 to 1."
    range: float
    minimum_value: 0
    maximum_value: 1
  confirmed:
    description: "A person confirmed the value. Must be true for inferred values before validation passes."
    range: boolean
