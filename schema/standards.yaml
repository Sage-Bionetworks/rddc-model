id: https://w3id.org/rddc/standards
name: rddc-standards
title: RDDC Standards
version: 0.1.0
description: >-
  Registry of the standards (ontologies, terminologies, classifications, data
  models and exchange schemas) considered for incoming Rare Disease Data
  Commons (RDDC) clinical data: where each standard comes from, how it is
  licensed and released, and which data categories and coverage domains it can
  represent. Converted from the "RAPID Ontology Exploration" workbook. Coverage
  is indicative, not a verified application implementation.

license: https://creativecommons.org/publicdomain/zero/1.0/

prefixes:
  rddc: https://w3id.org/rddc/vocab/
  linkml: https://w3id.org/linkml/
  sc: https://schema.org/
  dct: http://purl.org/dc/terms/
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  skos: http://www.w3.org/2004/02/skos/core#
  dcat: http://www.w3.org/ns/dcat#
  foaf: http://xmlns.com/foaf/0.1/
  owl: http://www.w3.org/2002/07/owl#

  # MOD (Metadata for Ontology Description)
  mod: "https://w3id.org/mod#"
  bioregistry: "https://bioregistry.io/registry/"

  # Namespaces of the standards themselves--

  # Data models and exchange standards
  fhir: "http://hl7.org/fhir/"

  # Clinical terminologies
  SNOMEDCT: "http://snomed.info/id/"
  LOINC: "https://loinc.org/"
  ICD10CM: "http://purl.bioontology.org/ontology/ICD10CM/"
  UCUM: "http://unitsofmeasure.org/"

  # Phenotype, disease, medical action and data use ontologies
  HP: "http://purl.obolibrary.org/obo/HP_"
  MONDO: "http://purl.obolibrary.org/obo/MONDO_"
  DOID: "http://purl.obolibrary.org/obo/DOID_"
  IDO: "http://purl.obolibrary.org/obo/IDO_"
  ORPHA: "http://www.orpha.net/ORDO/Orphanet_"
  MAXO: "http://purl.obolibrary.org/obo/MAXO_"
  DUO: "http://purl.obolibrary.org/obo/DUO_"

  # Medications
  RXNORM: "http://purl.bioontology.org/ontology/RXNORM/"
  DRUGBANK: "http://identifiers.org/drugbank:"
  CHEMBL.COMPOUND: "http://identifiers.org/chembl.compound:"

  # Genomic variation
  SO: "http://purl.obolibrary.org/obo/SO_"
  OMIM: "https://omim.org/entry/"
  HGNC: "https://identifiers.org/hgnc:"

default_prefix: rddc
default_range: string

imports:
  - linkml:types

# ---------------------------------------------------------------------------
classes:

  StandardsCatalog:
    tree_root: true
    description: >-
      Container for every collection. Each data file under src/data fills in
      one or more of these lists; scripts/merge_data.py combines them into one
      document that validates against this class.
    slots:
      - notes
    attributes:
      standards:
        description: Catalog entries for the standards (src/data/standards_registry.yaml).
        range: StandardEntry
        multivalued: true
        inlined_as_list: true
      dataCategories:
        description: Categories of incoming data (src/data/data_categories.yaml).
        range: DataCategory
        multivalued: true
        inlined_as_list: true
      coverageDomains:
        description: Coverage domains (src/data/coverage_domains.yaml).
        range: CoverageDomain
        multivalued: true
        inlined_as_list: true

  NamedThing:
    abstract: true
    description: Base class for every catalog item, giving its key and label.
    slots:
      - id
      - name

  # --- Standards ("Ontology Sources", "Ontology Allignments", "Ontology Coverage")
  StandardEntry:
    is_a: NamedThing
    slots:
      - notes
      - comments
    description: >-
      Catalog entry for an ontology, terminology, database, nomenclature or
      exchange standard. Not the same as the processing rules' Standard
      (processing.yaml), which is a conformsTo target; conformsToUrls links the two.
    slot_usage:
      name:
        description: Full name of the standard.
    attributes:
      abbreviation:
        required: true
        slot_uri: mod:acronym
        description: Abbreviation as written in the workbook.
      bioregistryPrefix:
        description: >-
          Canonical prefix of this standard in the Bioregistry
          (https://bioregistry.io/<prefix>), which holds its identifier
          patterns, URI formats, contacts and cross-registry mappings. Empty
          where the Bioregistry has no entry.
        pattern: "^[a-z0-9_.]+$"
        see_also:
          - https://bioregistry.io
      standardType:
        range: StandardTypeEnum
        slot_uri: dct:type
        description: From the "Standard type" column of the Ontology Coverage sheet.
      releaseVersion:
        slot_uri: owl:versionInfo
        description: >-
          Version label of the release currently catalogued (e.g. 2025-09-01,
          v2.81, R4), as the provider writes it. Empty where not yet recorded.
      releaseDate:
        range: date
        slot_uri: dct:issued
        description: >-
          Date the catalogued release was published, as an ISO 8601 date
          (YYYY-MM-DD). Empty where not yet recorded.
      # Access methods, from "Ontology Sources: Access Method". Each flag is set
      # (true) only where the workbook lists that method; absent means not
      # recorded, not that the method is unavailable.
      directDownloadAccess:
        range: boolean
        description: >-
          Release files can be downloaded directly (file server, release page or
          source repository), without an API.
      downloadApiAccess:
        range: boolean
        description: >-
          Release files can be fetched programmatically through a download API,
          such as the UMLS Release and Download API.
      # Download links, the credentials they need, and how to pick a release.
      directDownloadUrls:
        range: uri
        multivalued: true
        slot_uri: dcat:accessURL
        description: >-
          Pages or file servers where release files can be downloaded directly
          (release pages, FTP directories, source repositories).
      authenticationRequired:
        range: boolean
        description: >-
          True where downloading the release files needs credentials or an
          accepted license; false where they are openly downloadable. Absent
          means not yet checked.
      authenticationType:
        range: AuthenticationTypeEnum
        description: The credential needed, where authenticationRequired is true.
      releaseApiUrls:
        range: uri
        multivalued: true
        slot_uri: dcat:endpointURL
        description: Endpoints of an API that lists the available releases.
      downloadApiUrls:
        range: uri
        multivalued: true
        slot_uri: dcat:endpointURL
        description: Endpoints of an API that delivers release files.
      versionSelectionMethod:
        range: VersionSelectionMethodEnum
        description: How to find the current (or a chosen) release.
      # Formats, other links and licensing.
      dataFormats:
        multivalued: true
        slot_uri: mod:hasSyntax
        description: "Ontology Sources: Data Formats."
      otherUrls:
        range: uri
        multivalued: true
        slot_uri: rdfs:seeAlso
        description: >-
          Any other link about the standard: its homepage (listed first, from
          "Ontology Sources: Source") and documentation pages.
      accessRequirements:
        slot_uri: dct:accessRights
        description: "Ontology Sources: Access Requirements, as written."
      license:
        description: >-
          SPDX license identifier, filled only where the linked license page
          states it unambiguously.
      licenseUrl:
        range: uri
        slot_uri: dct:license
        description: License link attached to the Access Requirements cell.
      updateFrequency:
        slot_uri: dct:accrualPeriodicity
        description: >-
          "Ontology Sources: Update Frequency", as free text. In RDF,
          dct:accrualPeriodicity expects a frequency term (e.g. from the
          Dublin Core collection frequency vocabulary); map these values to
          such terms if you export to RDF.
      # Harmonization plan: whether the standard is in scope and what it is for.
      selectionStatus:
        range: SelectionStatusEnum
        description: >-
          Whether the standard has been selected for harmonization development
          or is still under consideration. Empty where not yet decided.
      harmonizationTasks:
        range: HarmonizationTaskEnum
        multivalued: true
        description: The harmonization tasks this standard supports.
      conformsToUrls:
        range: uri
        multivalued: true
        description: >-
          Versioned URLs a sidecar file set's conformsTo uses for this
          standard (e.g. http://hl7.org/fhir/R4), matching the url of the
          processing rules' Standard. Empty for standards that are only used
          to code values, not to structure files.
      alignedCategories:
        range: DataCategory
        multivalued: true
        description: >-
          Data categories this standard can represent or annotate
          (Ontology Allignments sheet; one tick per column).
      coveredDomains:
        range: CoverageDomain
        multivalued: true
        description: >-
          Fine-grained coverage domains this standard covers (Ontology Coverage
          sheet). Domain groups follow from each CoverageDomain's group.

  # --- "Incoming Data" sheet + the 21 alignment columns
  DataCategory:
    is_a: NamedThing
    slots:
      - notes
      - comments
    description: A category of incoming RDDC data.
    slot_usage:
      name:
        description: Short name used as the column header in the alignment matrix.
    attributes:
      sourceLabel:
        description: Row label as written on the Incoming Data sheet.
      details:
        description: "Incoming Data: Details."
      categorical:
        range: boolean
        description: "Incoming Data: Categorical? (Y/N)."
      dataClasses:
        multivalued: true
        pattern: "^[A-Z][A-Za-z0-9]*File$"
        description: >-
          Data file classes in data.yaml (DataFile subclasses, by class name)
          whose files carry this category, e.g. IntakeFormFile. Filled only
          where the class and category correspond one to one.
      proposedStandards:
        range: StandardEntry
        multivalued: true
        description: >-
          Standards the team proposed for this category (Incoming Data:
          Ontologies). Differs from StandardEntry.alignedCategories, which
          records what each standard could cover.
      proposedStandardsUncertain:
        range: StandardEntry
        multivalued: true
        description: Proposed standards written with a question mark.
      seeAlso:
        description: Links attached to the Ontologies cell.
        range: uri
        multivalued: true
        slot_uri: rdfs:seeAlso

  CoverageDomain:
    is_a: NamedThing
    description: A fine-grained coverage domain (column of the Ontology Coverage sheet).
    attributes:
      group:
        description: The domain group this domain belongs to.
        range: DomainGroupEnum
        required: true

# ---------------------------------------------------------------------------
slots:
  id:
    identifier: true
    description: Stable upper-case key.
  name:
    slot_uri: rdfs:label
    description: Human-readable name.
  notes:
    multivalued: true
    slot_uri: skos:note
    description: Notes recorded in the workbook itself.
  comments:
    multivalued: true
    description: Reviewer comments attached to cells in the workbook.

# ---------------------------------------------------------------------------
enums:

  SelectionStatusEnum:
    description: Where a standard stands in the harmonization plan.
    permissible_values:
      SELECTED:
        title: Selected
        description: Chosen for support through harmonization development.
      UNDER_CONSIDERATION:
        title: Under consideration
        description: Being evaluated; not yet chosen.

  HarmonizationTaskEnum:
    description: The harmonization tasks a standard can support.
    permissible_values:
      SCHEMA_RECOMMENDATION:
        title: Schema recommendation
        description: Recommending a target schema or data model for incoming data.
      CDE_RECOMMENDATION:
        title: Entity or Common Data Element (CDE) recommendation
        description: Recommending entities or common data elements for incoming fields.
      VALUE_STANDARDIZATION:
        title: Value standardization
        description: Mapping field values to codes or terms of the standard.
      SCHEMA_ALIGNMENT_AND_TRANSFORMATION:
        title: Schema alignment and transformation
        description: Aligning a source schema to a target and transforming the data.

  AuthenticationTypeEnum:
    description: Credentials needed to download a standard's release files.
    permissible_values:
      API_KEY:
        title: API key
        description: A personal API key sent with each request (e.g. a UMLS UTS API key).
      ACCOUNT_LOGIN:
        title: Account login
        description: A user name and password for the provider's website.

  VersionSelectionMethodEnum:
    description: How an automated downloader finds the current or a chosen release.
    permissible_values:
      RELEASE_API:
        title: Release API
        description: Query an API that lists releases (see releaseApiUrls).
      GITHUB_RELEASES:
        title: GitHub releases
        description: Take the latest (or a tagged) GitHub release.
      GITHUB_RELEASES_OR_VERSION_IRI:
        title: GitHub releases or version IRI
        description: >-
          Use GitHub releases, checking the ontology's version IRI where releases
          lag behind the ontology itself.
      GITHUB_RELEASES_OR_XML_VERSION:
        title: GitHub releases or XML version
        description: Use GitHub releases, or the version stated inside the XML file.
      GITHUB_TAGS_OR_ONTOLOGY_VERSION_IRI:
        title: GitHub tags or ontology version IRI
        description: Use GitHub tags, or the ontology's version IRI.
      DIRECTORY_LISTING:
        title: Directory listing
        description: Pick from dated or versioned files in a download directory.
      FTP_DIRECTORY_LISTING:
        title: FTP directory listing
        description: Pick from dated or versioned files in an FTP directory.
      RELEASE_WEBPAGE:
        title: Release web page
        description: Read the release from a public web page that lists versioned files.
      RELEASE_PORTAL:
        title: Release portal
        description: Pick the release in the provider's (usually logged-in) download portal.
      W3C_SPEC_VERSION:
        title: W3C specification version
        description: Use the dated version of the W3C specification.
      CONTINUOUS_UPDATE:
        title: Continuous update
        description: >-
          The resource is continuously updated without formal
          versioned releases. Record the retrieval date for
          reproducibility.
      NOT_VERIFIED:
        title: Not verified
        description: No release source confirmed yet; do not automate downloads.

  StandardTypeEnum:
    description: Type of standard or structured resource.
    permissible_values:
      ONTOLOGY:
        title: Ontology
      CLINICAL_TERMINOLOGY:
        title: Clinical terminology
      CLASSIFICATION:
        title: Classification
      NOMENCLATURE:
        title: Nomenclature
      UNIT_STANDARD:
        title: Unit standard
      DATABASE:
        title: Database
      COMMON_DATA_MODEL:
        title: Common data model
      EXCHANGE_SCHEMA:
        title: Exchange schema

  DomainGroupEnum:
    description: The seven groups the coverage domains fall into.
    permissible_values:
      PATIENT_AND_CONTEXT:
        title: Patient & context
      PHENOTYPE_AND_DISEASE:
        title: Phenotype & disease
      CLINICAL_ACTIVITIES:
        title: Clinical activities
      OBSERVATIONS_AND_SPECIMENS:
        title: Observations & specimens
      GENOMIC_AND_MOLECULAR:
        title: Genomic & molecular
      DRUGS_AND_THERAPEUTICS:
        title: Drugs & therapeutics
      INFORMATION_AND_INTEROPERABILITY:
        title: Information & interoperability
