name: Validate LinkML

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LinkML
        run: pip install "linkml==1.11.1"

      - name: Collect schema files
        id: files
        run: |
          shopt -s nullglob
          files=(header.yaml schema/*.yaml)
          echo "Schema files: ${files[*]}"
          echo "list=${files[*]}" >> "$GITHUB_OUTPUT"

      - name: Validate against the LinkML metamodel
        run: |
          for f in ${{ steps.files.outputs.list }}; do
            echo "::group::linkml validate $f"
            linkml validate "$f"
            echo "::endgroup::"
          done

      - name: Lint
        run: |
          for f in ${{ steps.files.outputs.list }}; do
            echo "::group::linkml-lint $f"
            linkml-lint --config .linkml-lint.yaml "$f"
            echo "::endgroup::"
          done

      - name: Check schemas load and generate
        run: |
          for f in ${{ steps.files.outputs.list }}; do
            echo "::group::gen-json-schema $f"
            gen-json-schema --closed "$f" > /dev/null
            echo "::endgroup::"
            echo "::group::gen-jsonld $f"
            gen-jsonld "$f" > /dev/null
            echo "::endgroup::"
          done

      - name: Check the structure, modality and biometric annotations on data file classes
        run: python scripts/check_structure.py schema/data.yaml

      - name: Check example data file objects against the schema
        run: python scripts/check_data_files.py schema/data.yaml

      - name: Generate the schemas (JSON Schema, SHACL, JSON-LD context) and check the committed ones are current
        run: |
          make schema
          git diff --exit-code -- schema/generated examples

      - name: Publish the generated schemas as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: schemas
          path: schema/generated/

  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: schemas
          path: schema/generated

      - name: Attach the generated schemas to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "Data model release $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" schema/generated/* --repo "$GITHUB_REPOSITORY" --clobber
